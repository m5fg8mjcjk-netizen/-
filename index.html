function setupView(){let steps=['オーナー情報','店づくり','出店地域','開店日','求人条件'];let v='';if(S.step===0)v=`<label class="field">オーナーのお名前<input id="owner" maxlength="16" placeholder="例：ゆうと" value="${clean(S.owner)}"></label><p class="small">あなたはこのお店のオーナーです。</p>`;if(S.step===1)v=`<label class="field">お店の名前<input id="store" maxlength="22" placeholder="例：ゆめいろメイド" value="${clean(S.store)}"></label><label class="field">コンセプト<select id="concept">${['王道メイド','ゴシック','けもの系','アイドル系','BAR系','オリジナル'].map(x=>`<option ${S.concept===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field" id="customwrap" ${S.concept==='オリジナル'?'':'style="display:none"'}>オリジナルのコンセプト<input id="customconcept" maxlength="24" placeholder="コンセプトを入力"></label>`;if(S.step===2)v=`<div class="grid">${[['地方','🌲','家賃が安く常連中心。厄介客は多め。'],['地元','🏘️','バランス型。安定した経営。'],['都会','🌃','札幌の繁華街。集客力が高いが家賃も高い。']].map(([n,e,d])=>`<button type="button" class="card ${S.place===n?'selected':''}" data-place="${n}" style="text-align:left"><b>${e} ${n}</b><p class="small">${d}</p></button>`).join('')}</div>`;if(S.step===3)v=`<label class="field">開店予定日<input type="date" id="opendate" value="${S.openDate}"></label><p class="small">この日を開店日としてゲーム内の約2か月を1日ずつ進めます。</p>`;if(S.step===4)v=`<h3>💰 時給を選ぶ</h3><div class="row">${[1200,1400,1700].map(n=>`<button type="button" class="btn ${S.wage===n?'primary':'line'}" data-wage="${n}">${n.toLocaleString()}円</button>`).join('')}</div><h3 style="margin-top:18px">💗 バック設定</h3><div class="row">${['なし','低い','高い'].map(n=>`<button type="button" class="btn ${S.back===n?'primary':'line'}" data-back="${n}">${n}</button>`).join('')}</div><p class="small">高待遇ほど応募が増えやすく、やる気にも影響します。ただし経費がかかります。</p><div class="message"><b>求人プレビュー</b><br>${clean(S.store||'あなたのお店')} ／ ${S.place}<br>時給${S.wage}円・バック${S.back}・${clean(S.concept)}</div>`;root.innerHTML=`<section class="panel"><div class="small">開店準備 ${S.step+1}/5</div><div class="progress"><span style="width:${(S.step+1)*20}%"></span></div><h2 style="margin-top:14 function tutorialView(){root.innerHTML=`<section class="panel"><div class="small">🎀 開店準備ができました！</div><h2 style="text-align:center;color:#d65a96">♡ あそびかた ♡</h2><p style="text-align:center">${clean(S.owner)}オーナー、ようこそ <b>${clean(S.store)}</b> へ！<br>女の子たちと一緒に北海道No.1を目指そう♪</p><div class="stack"><div class="card"><h3>① 👧 履歴書から採用しよう</h3><p>最初に5人が応募するよ。自己PRを読んで、好きな人数を採用してね。採用後は能力が確認できるよ！</p></div><div class="card"><h3>② 🏠 お店は自動で営業するよ</h3><p>2Dの店内でキャストやお客さんが動くよ。女の子たちは自主的に接客・掃除・配信などをするから、眺めているだけでも営業が進むよ。</p></div><div class="card"><h3>③ 💗 得意な仕事をお願いしよう</h3><p>キャストに「ライブ配信」「接客」「POP作り」などの指示を出せるよ。女の子の発言から好き・苦手を発見しよう！ 同じ仕事ばかりだと疲れちゃうので気をつけてね。</p></div><div class="card"><h3>④ 🚨 トラブルには店長が対応！</h3><p>迷惑客、泣いてしまう女の子、退職相談などが起きたら時間が止まるよ。選択肢を選んで、結果を確認してね。</p></div><div class="card"><h3>⑤ 🌙 閉店したら翌日に備えよう</h3><p>売上・噂話・シフトを確認。シフトから外したり、お休みの子に追加出勤をお願いしたりできるよ。噂には将来の出来事のヒントも！</p></div><div class="card"><h3>⑥ 🏆 2か月間、お店を育てよう</h3><p>求人、発注、ルール変更、キャストの相談も大切。営業は通常・倍速を切り替えられるよ。最後にライバル店と総合評価を比べるよ！</p></div></div><div class="message" style="margin-top:14px">🌿 コツ：売上だけじゃなく、女の子のストレスや信頼にも気を配ろう。苦手な仕事でも信頼があれば成長するチャンス！</div><div class="controls">${btn('← 開店設定に戻る','tutorialBack','line')}${btn('わかった！求人を見にいく ♡','tutorialDone','primary')}</div></section>`;}
function hireView(){let c=S.applications;root.innerHTML=`<section class="panel"><div class="turnhead"><h2>📨 オープニングスタッフ募集</h2><p class="small">5名の応募が届きました。採用は0〜5名から自由に選べます。開店初日は採用者全員が出勤します。</p></div><p>採用済み：<b>${S.staff.length}人</b> ／ 未確認：<b>${c.filter(x=>!x.decided).length}人</b></p><div class="stack">${c.map(x=>`<article class="card"><div class="girl"><span class="avatar">${x.face}</span><div class="girlbody"><b>${clean(x.name)}（${x.age}歳）</b><div class="small">経験：${x.experience?'コンカフェ'+x.experience+'年':'未経験'} ／ 希望：週${x.desired}日 ／ 性格：${x.personality}</div></div></div><div class="message">「${clean(x.pr)}」</div>${x.decided?`<span class="chip">${x.decided==='yes'?'✅ 採用決定':'見送り'}</span>`:`<div class="row">${btn('♡ 採用','accept:'+x.id,'primary')}${btn('見送る','reject:'+x.id,'line')}</div>`}</article>`).join('')}</div><div class="divider"></div>${btn('🎉 このメンバーで開店する','open','primary block')}</section>`;}
function createApplications(initial){let used=new Set([...S.staff.map(c=>c.name),...S.applications.map(c=>c.name)]);let v=[];if(initial){v.push(makeCandidate(S.fixedFirst));used.add(S.fixedFirst);}else if(!S.fixedLater&&S.turn>=5){let other=S.fixedFirst==='かんな'?'あおい':'かんな';v.push(makeCandidate(other));used.add(other);S.fixedLater=true;}let cnt=initial?5:Math.max(0,rand(0,2)+(S.popularity>35?1:0)-(S.wage===1200?1:0)-(S.back==='なし'?1:0));if(!initial&&v.length)cnt=Math.max(cnt,1);while(v.length<cnt){let pool=names.filter(n=>!used.has(n));if(!pool.length)break;let name=pick(pool);used.add(name);v.push(makeCandidate(name));}S.applications=v;}
function createRivals(place){const base=place==='都会'?67:place==='地方'?35:49;return [{name:'シュガードール',score:base+7,base:base+7},{name:'月夜のアリス',score:base+14,base:base+14},{name:'ほしぞらメイド',score:base-3,base:base-3}];}
function normalizeRivals(arr,place){if(!Array.isArray(arr)||!arr.length)return createRivals(place);const base=createRivals(place);return base.map((r,i)=>({...r,score:clamp(Math.round(arr[i]?.score??r.score),0,100)}));}
function customerSatisfaction(){const penalty=(S.customerDifficulty||0);return clamp(Math.round(S.review-penalty),0,100);}
function castSatisfaction(){const members=S.staff.filter(c=>!c.quit);if(!members.length)return 0;let average=members.reduce((sum,c)=>sum+(c.trust*.48+c.motivation*.42+(100-c.stress)*.10),0)/members.length;return clamp(Math.round(average-(S.staffDifficulty||0)),0,100);}
function rankingScore(){const cashHealth=clamp(50+S.profitTotal/25000,0,100);return clamp(Math.round(S.popularity*.42+customerSatisfaction()*.23+castSatisfaction()*.22+cashHealth*.13),0,100);}
function rankings(){return [{name:S.store||'あなたのお店',score:rankingScore(),player:true},...S.rivals.map(r=>({...r,player:false}))].sort((a,b)=>b.score-a.score);}
function rankingView(){const rows=rankings();return `<p class="small">地域：${S.place} ／ 都会ほど競合店の初期評価と成長が高くなります。順位は営業中も確認できます。</p><div class="stack">${rows.map((r,i)=>`<div class="card row between" style="${r.player?'background:#fff0f7;border-color:#ee87bc':''}"><b>${i+1}位 ${r.player?'🎀 ':i===0?'👑 ':'🏠 '}${clean(r.name)}${r.player?'（あなた）':''}</b><span class="chip">${r.score} / 100</span></div>`).join('')}</div><div class="message">🏆 現在 ${rows.findIndex(x=>x.player)+1}位／${rows.length}店舗。お客様満足度 ${customerSatisfaction()}点・キャスト満足度 ${castSatisfaction()}点・店舗人気 ${Math.round(S.popularity)}点。どれも100点を目指そう！</div>`;}
function updateRivals(){const placePower=S.place==='都会'?1.5:S.place==='地方'?.62:1;const progress=(S.turn+1)/S.maxTurns;S.rivals.forEach((r,i)=>{const drift=(Math.random()-.41)*3.3*placePower;const target=(r.base??r.score)+progress*(S.place==='都会'?17:S.place==='地方'?8:12);r.score=clamp(Math.round(r.score*.78+target*.22+drift),0,100);});}
function traitEffect(c){return { '敏腕':{sales:1.28,quote:'お客様の好み、ちゃんと覚えてますよ♡'},'営業の天才':{sales:1.20,quote:'今日はドリンクもおすすめしてみますね！'},'愛され体質':{sales:1.08,quote:'また会いに来てくれたんですね♡'},'気配り上手':{sales:1.07,quote:'お席の様子を見てきますね'},'遅刻魔':{sales:0.86,quote:'すみません、少し遅れちゃいました……'},'遅刻癖':{sales:0.93,quote:'今日は時間に間に合ったかな……'},'サボり癖':{sales:0.88,quote:'ちょっとだけ休憩したいな〜'},'努力家':{sales:1.05,quote:'もっと接客が上手になりたいです！'}}[c.trait]||{sales:1,quote:''};}
function shiftGenerate(){let day=S.turn+1;let active=S.staff.filter(c=>!c.quit&&c.absence<=0);let attendance=active.filter(c=>Math.random()<Math.min(.92,Math.max(.32,c.desired/7+.15))&&!(c.stress>88&&Math.random()<.55));if(!attendance.length&&active.some(c=>c.stress<92))attendance=[active.filter(c=>c.stress<92).sort((a,b)=>b.motivation-a.motivation)[0]];S.staff.forEach(c=>{c.shift=attendance.some(a=>a.id===c.id);if(S.shiftPlan[day]&&Object.hasOwn(S.shiftPlan[day],c.id))c.shift=c.absence<=0&&S.shiftPlan[day][c.id];});S.nextShifts=S.staff.filter(c=>c.shift&&!c.quit).map(c=>c.name);}
function activeGirls(){return S.staff.filter(c=>c.shift&&!c.quit&&!c.absence);}
function randomReview(){let c=pick(S.staff.filter(c=>!c.quit));let good=Math.random()<S.review/100;let msg=good?pick([`女の子が親切でまた来たいです！`,`店内がかわいくて癒されました♡`,`${c?.name||'キャスト'}ちゃんの接客が楽しかった！`]):pick(['混んでいて少し待ちました。','接客がちょっと雑だったかも。','お目当ての子がお休みでした……']);S.reviews.unshift({score:good?rand(4,5):rand(1,3),text:msg});S.reviews=S.reviews.slice(0,10);}
function playView(){root.innerHTML=`${header()}<div class="cols"><div><section class="panel"><div class="section-title"><h3>🏠 ${clean(S.store)} の店内</h3><span class="chip">${S.phase==='before'?'☀️ 開店前':S.phase==='during'?'🌙 営業中':'🌃 閉店'}</span></div><div class="scene" id="scene"><div class="window"></div><div class="wallart">♡ ${clean(S.store.slice(0,14))} ♡</div><div class="shelf"></div><div class="counter"></div><div class="table"></div><div class="plant">🪴</div><div id="sprites"></div></div><div class="controls" id="scenecontrols">${sceneControls()}</div></section><section class="panel"><div class="section-title"><h3>📜 リアルタイムログ</h3><span class="chip lav" id="clock">${S.phase==='during'?'18:00':'営業準備'}</span></div><div id="log" class="scroller">${renderLogs()}</div></section></div><div><section class="panel"><h3>🎀 オーナーコマンド</h3><div class="menu">${[['💰 売上','sales'],['📩 求人','jobs'],['👧 キャスト','girls'],['⭐ レビュー','reviews'],['📜 ルール','rules'],['📦 発注','order'],['📅 シフト','shift'],['🎉 企画','plan'],['🗣️ 噂・相談','rumors'],['🏆 ランキング','ranking'],['🏠 お店','shop']].map(([a,b])=>btn(a,'panel:'+b)).join('')}</div></section><section class="panel"><h3>👧 今日のキャスト</h3><div class="stack">${activeGirls().length?activeGirls().map(c=>`<div class="card"><div class="row between"><b>${c.face} ${clean(c.name)}</b><span class="chip">${icon[c.task]||'🍾'} ${clean(c.task)}</span></div><div class="small">${c.personality} ／ ${c.stats.map(rank).join('・')}</div><div style="margin-top:8px">${btn('仕事を指示する','task:'+c.id,'alt block')}</div></div>`).join(''):'<div class="empty">本日の出勤者がいません</div>'}</div><div class="small" style="margin-top:8px">特別な指示は1人につき1営業日2回。通常接客は自動です。</div></section><section class="panel"><h3>📦 店内の状況</h3><div class="row between"><span>在庫</span><b>${S.stock}個</b></div><div class="row between"><span>清潔度</span><b>${Math.round(S.cleanliness)} / 100</b></div><div class="row between"><span>総来店数（今回）</span><b>${S.visitors}人</b></div></section></div></div>`;drawSprites();if(S.phase==='during')startTick();}
function sceneControls(){if(S.phase==='before')return `${btn('🌙 営業スタート','begin','primary')}${btn('📅 シフト表','panel:shift','line')}`;if(S.phase==='during')return `${btn(S.playSpeed===0?'▶ 再開':'⏸ 一時停止','pause','alt')}${btn('⏩ 2倍速 '+(S.playSpeed===3?'ON':'OFF'),'speed','line')}${btn('🌃 閉店する','close','primary')}`;return btn('📊 営業報告を見る','report','primary');}
function renderLogs(){return S.logs.slice(-50).map(l=>`<div class="logline ${l.special?'special':''}">${clean(l.text)}</div>`).join('')||'<div class="empty">オーナーの指示を待っています ♡</div>';}
function log(m,special=false){S.logs.push({text:m,special});S.logs=S.logs.slice(-100);let e=$('#log');if(e){e.innerHTML=renderLogs();e.scrollTop=e.scrollHeight;}}
function drawSprites(){let el=$('#sprites');if(!el)return;let g=activeGirls().slice(0,9);let customers=S.phase==='during'?Math.min(4,Math.floor(S.visitors/2)%5):0;el.innerHTML=g.map((c,i)=>`<div class="sprite" data-sprite="${c.id}" style="--x:${(i%4)*20+8}%;--y:${-(i%3)*25-17}px"><div class="bubble">${icon[c.task]||'💬'}</div><div class="face">${c.face}</div><div class="spriteName">${clean(c.name)}</div></div>`).join('')+Array.from({length:customers},(_,i)=>`<div class="sprite customer" data-c="${i}" style="--x:${52+i*11}%;--y:${-60+(i%2)*20}px"><div class="face">${['🧑','👨','👤','🧑🏻'][i]}</div><div class="spriteName">お客さん</div></div>`).join('');}
function moveSprites(){document.querySelectorAll('.sprite').forEach(el=>{el.style.setProperty('--x',rand(8,79)+'%');el.style.setProperty('--y',-rand(15,95)+'px');});}
function startTick(){clearTimers();if(S.playSpeed===0||S.eventPending||overlay.querySelector('.modalback'))return;tick=setInterval(()=>{if(S.phase!=='during'||S.eventPending||overlay.querySelector('.modalback'))return;S.clock++;let hr=18+Math.floor(S.clock/5),mn=(S.clock%5)*12;let el=$('#clock');if(el)el.textContent=`${String(Math.min(hr,23)).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;stepActivity();if(S.clock%2===0)moveSprites();if(S.clock>=25)closeDay();},S.playSpeed===3?300:650);}
function addSale(amount,c,kind){S.dayRevenue+=amount;S.stock=Math.max(0,S.stock-(kind==='ドリンク'||kind==='フード'?1:0));if(c){c.sales+=amount;c.fans+=Math.random()<.18?1:0;}S.orders++;}
function stepActivity(){let g=activeGirls();if(!g.length){if(Math.random()<.3)log('店内にキャストがいないため、営業できません。');return;}let c=pick(g);const p=Math.random();if(S.clock%6===0&&Math.random()<.23){let job=pick(c.likes||['接客に専念']);log(`🌷 ${c.name}「少し時間ができたから、${job}しておこうかな♡」`);if(job==='店内掃除')S.cleanliness=clamp(S.cleanliness+3);else if(job==='POP作り')S.popularity=clamp(S.popularity+1);else if(job==='ライブ配信'||job==='自撮り・SNS')S.visitors+=S.place==='都会'?2:1;else if(job==='接客に専念')addSale(800,c,'チェキ');}if(S.clock>4&&!S.eventPending){
 const canMinor=(S.minorEvents||0)<1,canMajor=(S.majorEvents||0)<1 && (S.eventCooldown||0)===0;
 if(canMinor&&Math.random()<.012){S.minorEvents=(S.minorEvents||0)+1;incident('break');return;}
 if(canMajor&&Math.random()<.022){S.majorEvents=(S.majorEvents||0)+1;S.eventCooldown=rand(3,5);incident('major');return;}
 }if(p<.32){let kind=pick(['ドリンク','チェキ','フード','ボトル']);if(S.stock<=0&&['ドリンク','フード'].includes(kind)){log('📦 在庫が不足して注文を受けられませんでした……');return;}let amount={ドリンク:1200,チェキ:1200,フード:1500,ボトル:rand(1,4)*10000}[kind];let mult=c.task==='接客に専念'?1:0.52;let rate=(.55+.12*c.stats[4])*(.55+c.motivation/120)*mult*traitEffect(c).sales;if(Math.random()<Math.min(.91,rate)){addSale(amount,c,kind);log(`🍾 ${c.name}が${kind}の注文を獲得！ +${money(amount)}`);S.review=clamp(S.review+.4);}else log(`${c.name}が接客中。お客さんとお話ししています。`);}else if(p<.53){let arrivals=Math.max(0,Math.round((S.place==='都会'?3:S.place==='地方'?1:2)*(1+S.popularity/80)*Math.random()));S.visitors+=arrivals;if(arrivals)log(`🚪 お客さんが${arrivals}人来店しました！`);else log(`☕ ${c.name}が店内を見回っています。`);drawSprites();}else if(p<.77){let lines=c.personality==='まじめ'?['お仕事、きちんとやらないと……','今日も頑張ります！']:c.personality==='天然'?['えへへ、たのしいですね〜！','あれ？さっき何してたっけ？']:['今日も頑張ろう！','お客さんとのお話、楽しいな'];log(`💬 ${c.name}「${pick(lines)}」`);}else{if(Math.random()<.35){let gain=rand(1,3)+(c.trait==='敏腕'?1:0);S.popularity=clamp(S.popularity+gain);log(`📱 ${c.name}のおかげでお店の投稿が注目されています！ 人気+${gain}`,true);}else log(`✨ ${c.name}が${c.task}に取り組んでいます。${traitEffect(c).quote?' '+traitEffect(c).quote:''}`);}}
function chooseTask(id){let c=S.staff.find(x=>x.id===+id);if(!c||!c.shift||S.phase==='report')return;if(c.assigned>=2){toast('本日の指示上限（2回）です');return;}let body=`<p class="small">${clean(c.name)}に仕事をお願いしよう。発言を聞いて適性を見極めてね。</p><div class="grid">${jobs.map((j,i)=>`<button class="btn line" data-modal-task="${c.id}:${i}">${icon[j]} ${j}</button>`).join('')}</div><p class="small">残り指示回数：${2-c.assigned}</p>`;showModal(`${c.face} ${c.name}への指示`,body);}

function closeDay(){clearTimers();if(S.phase!=='during')return;S.phase='report';let g=activeGirls();let wages=g.reduce((a,c)=>a+(c.salary||S.wage)*5,0);let back=S.back==='高い'?.22:S.back==='低い'?.10:0;let expense=wages+Math.round(S.dayRevenue*back)+Math.round(S.dayRevenue*.12);let margin=S.dayRevenue-expense;S.cash+=margin;S.dayExpense=expense;S.salesTotal+=S.dayRevenue;S.profitTotal+=margin;S.review=clamp(S.review+(S.cleanliness>75?.25:S.cleanliness>55?-.1:-1.6)+(g.length<2?-1.2:0));if(S.cleanliness<55)S.customerDifficulty=clamp((S.customerDifficulty||0)+.6,0,22);else S.customerDifficulty=Math.max(0,(S.customerDifficulty||0)-.14);if(g.length){const tired=g.filter(c=>c.stress>65).length;S.staffDifficulty=clamp((S.staffDifficulty||0)+(tired? .38*tired:-.08),0,22);}S.cleanliness=clamp(S.cleanliness-4);for(let c of g){modify(c,{stress:rand(0,4)+(S.rules.quota==='あり'?3:0),motivation:S.back==='高い'?2:S.back==='なし'?-2:0});}S.popularity=clamp(S.popularity+rand(0,2)+(S.dayRevenue>22000?1:0));if(Math.random()<.35&&g.length)randomReview();calculateRumors();S.nextShifts=S.staff.filter(c=>!c.quit&&c.absence<=0&&Math.random()<Math.max(.4,Math.min(.95,c.desired/6+.2))).map(c=>c.name);if(!S.nextShifts.length){let available=S.staff.filter(c=>!c.quit&&c.absence<=0);if(available.length)S.nextShifts=[available[0].name];}log(`🌃 閉店。本日の売上は${money(S.dayRevenue)}です。`,true);S.lastEnd={income:S.dayRevenue,expense,margin,visitors:S.visitors,rumors:S.closingRumors,day:S.turn+1};render();}

function advance(){closeModal();if(S.turn>=S.maxTurns-1){finish();return;}S.turn++;S.day=S.turn+1;S.eventCooldown=Math.max(0,(S.eventCooldown||0)-1);S.eventFatigue=Math.max(0,(S.eventFatigue||0)-5);let g=S.staff.filter(c=>!c.quit);for(let c of g){c.absence=Math.max(0,c.absence-1);modify(c,{stress:-rand(2,6),motivation:rand(-2,3)});if(c.stress>91&&c.trust<38&&Math.random()<.08){c.absence=rand(2,4);S.logs.push({text:`💨 ${c.name}から連絡が取れず、しばらく出勤できないようです。`,special:true});S.story.push(`${S.day}日目：${c.name}が無断欠勤`);}else if(c.stress>94&&c.trust<18&&Math.random()<.035){c.quit=1;S.logs.push({text:`🎓 ${c.name}が突然退職しました……`,special:true});S.story.push(`${S.day}日目：${c.name}が退職`);}}if(S.turn===29||S.turn===59){let rent=S.place==='地方'?50000:S.place==='地元'?120000:300000;S.cash-=rent;S.profitTotal-=rent;S.logs.push({text:`🏠 家賃${money(rent)}を支払いました。`,special:true});}if(!S.fixedLater&&S.turn>=7){createApplications(false);S.logs.push({text:'📩 固定キャストを含む求人応募が届きました！',special:true});}else if(S.turn%5===0||S.staff.filter(c=>!c.quit).length===0){createApplications(false);if(S.applications.length)S.logs.push({text:`📩 求人への応募が${S.applications.length}件届きました！`,special:true});}S.logs=S.logs.slice(-100);S.phase='before';updateRivals();let preset=S.nextShifts.slice();shiftGenerate();S.staff.forEach(c=>{if(!c.quit&&c.absence<=0&&preset.includes(c.name))c.shift=true;});S.nextShifts=S.staff.filter(c=>c.shift&&!c.quit).map(c=>c.name);if(S.turn%10===0){S.story.push(`${S.day}日目：店舗人気${Math.round(S.popularity)}、累計売上${money(S.salesTotal)}`);}if(S.cash<=-100000){finish(true);return;}render();}
function triggerMainEvent(){let g=S.staff.filter(x=>!x.quit);if(!g.length)return;let c=g.slice().sort((a,b)=>b.stress-a.stress)[0];let eventType=c.stress>65?'cry':Math.random()<.45?'graduate':'customer';S.eventPending={id:c.id,type:eventType};let title=eventType==='cry'?'😢 キャストが泣いてしまった！':eventType==='graduate'?'🎓 卒業の相談':'⚠️ 困ったお客さん';let body=eventType==='cry'?`<p>💬 ${c.name}「ごめんなさい……最近ちょっとしんどくて、涙が止まらないです……」</p>`:eventType==='graduate'?`<p>💬 ${c.name}「店長、実はそろそろ卒業しようか悩んでいて……」</p>`:`<p>👤 お客さんが${c.name}にしつこく話しかけています。対応が必要そうです。</p>`;body+=`<div class="stack">${(eventType==='cry'?[['話を聞く','hear'],['今日は帰って休んでもらう','rest'],['原因を解決する','solve'],['励まして戻ってもらう','cheer'],['そのまま働いてもらう','force']]:eventType==='graduate'?[['理由を聞いて相談する','hear'],['待遇改善を提案','pay'],['休暇を提案','rest'],['引き止める','retain'],['卒業を応援する','leave']]:[['厳しく注意して退店してもらう','solve'],['キャストの話を聞く','hear'],['売上を優先して見守る','force']]).map(([l,a])=>btn(l,'event:'+a,'line block')).join('')}</div>`;showModal(title,body);}
function resolveEvent(choice){let ev=S.eventPending;if(!ev)return;let c=S.staff.find(x=>x.id===ev.id);if(!c)return;let msg='';let chance=(c.trust/100*.45)+(1-c.stress/100)*.32+(choice==='hear'||choice==='solve'?.2:choice==='pay'?.14:choice==='rest'?.12:0);if(ev.type==='cry'){if(choice==='solve'||choice==='hear'){modify(c,{trust:12,stress:-rand(10,22)});msg=`${c.name}の話を聞き、問題に向き合いました。少しずつ元気を取り戻しました。`;}else if(choice==='rest'){c.absence=1;modify(c,{stress:-22,trust:8});msg=`${c.name}はしばらくお休みすることになりました。`;}else if(choice==='force'){modify(c,{trust:-23,stress:18});if(Math.random()>.55){c.quit=1;msg=`${c.name}は店を去ってしまいました……`;}else{c.absence=2;msg=`${c.name}はその後しばらく出勤しなくなりました……`;}}else{modify(c,{stress:-4,trust:-4});msg=`${c.name}はなんとか接客に戻りましたが、疲れは残っています。`;}}else if(ev.type==='graduate'){if(choice==='leave'){c.quit=1;msg=`${c.name}の卒業を応援しました。円満な卒業です。`;modify(c,{trust:8});}else if(Math.random()<chance){modify(c,{trust:10,stress:-16,motivation:11});msg=`${c.name}「もう少しここで頑張ってみます……！」引き止めに成功！`;}else{c.quit=1;msg=`${c.name}は卒業を決めました。気持ちは変わりませんでした……`;}}else{if(choice==='force'){modify(c,{trust:-15,stress:23});S.review=clamp(S.review-6);msg='お客さんの問題を放置し、キャストが不安を感じています。';}else{modify(c,{trust:12,stress:-12});S.review=clamp(S.review+2);msg='お客さんに対応し、キャストを守りました。';}}S.eventPending=null;closeModal();log('📣 '+msg,true);toast(msg);render();if(S.phase==='during')startTick();}
function talk(name){let c=S.staff.find(x=>x.name===name&&!x.quit);if(!c){toast('現在この子に話を聞けません');return;}let msg=c.stress>65?'最近ちょっと疲れていて……少し休みたいです。':c.trust<35?'正直、お店のやり方で気になっていることがあります。':'話を聞いてくれて嬉しいです！';modify(c,{trust:8,stress:-5});closeModal();log(`💬 ${c.name}「${msg}」`,true);toast('話を聞きました。信頼度に変化がありました');}
function finish(bankrupt=false){S.mode='end';S.finished=true;S.score=rankingScore();S.finalRank=rankings().findIndex(r=>r.player)+1;S.finalCustomer=customerSatisfaction();S.finalStaff=castSatisfaction();S.ending=bankrupt?'閉店エンド':S.finalRank===1?'👑 北海道No.1！':S.score>=65?'🌟 北海道の人気店':S.score>=42?'🌸 地元の愛され店':'💔 苦戦したお店';render();}
function endView(){root.innerHTML=`${header()}<section class="panel hero"><div class="large">${S.finalRank===1?'🏆':'🎀'}</div><h2>2か月間の経営、おつかれさま！</h2><h2>${S.ending}</h2><p class="subtitle">目標は4項目すべて最高評価！<br>${clean(S.owner)}オーナーの ${clean(S.store)}</p><div class="grid"><div class="card">💗 お客様満足度<h2>${S.finalCustomer} / 100点</h2></div><div class="card">👧 キャスト満足度<h2>${S.finalStaff} / 100点</h2></div><div class="card">🏆 ライバルランキング<h2>${S.finalRank}位 / ${S.rivals.length+1}店</h2></div><div class="card">🌷 店舗人気度<h2>${Math.round(S.popularity)} / 100点</h2></div></div><div class="message">🌟 全項目最高評価を目指そう！ お客様とキャストの満足度は簡単には100点にならないよ。<br>経営総合評価：<b>${S.score} / 100点</b></div><div class="grid"><div class="card">💰 累計売上<h3>${money(S.salesTotal)}</h3></div><div class="card">📈 最終収支<h3>${money(S.profitTotal)}</h3></div></div><h3 style="margin-top:16px">📖 お店の思い出</h3><div class="message" style="text-align:left">${(S.story||[]).slice(-12).map(x=>`🌷 ${clean(x)}<br>`).join('')||'仲間と過ごした2か月間。'}</div><h3>🏆 最終ランキング</h3>${rankingView()}<div class="controls">${btn('♡ もう一度遊ぶ','new','primary')}</div></section>`;}

function setShift(id,delta){let c=S.staff.find(x=>x.id===+id&&!x.quit);if(!c)return;let d=S.phase==='report'?S.turn+1:S.turn;if(delta==='ask'){if(c.absence>0){toast('しばらく出勤できないようです');return;}let chance=clamp(25+c.trust*.48+c.motivation*.16-c.stress*.48,5,94);if(Math.random()*100>chance){showModal('📱 出勤のお願い',`<p>${clean(c.name)}「ごめんなさい、その日は難しいです……」</p>${btn('OK','closeModal','primary block')}`);return;}}if(!S.shiftPlan[d])S.shiftPlan[d]={};S.shiftPlan[d][c.id]=delta==='ask';if(d===S.turn)c.shift=delta==='ask';if(d===S.turn+1)S.nextShifts=S.staff.filter(x=>!x.quit&&(Object.hasOwn(S.shiftPlan[d],x.id)?S.shiftPlan[d][x.id]:S.nextShifts.includes(x.name))).map(x=>x.name);log(`📅 ${c.name}の${d===S.turn?'本日':'翌日'}シフトを変更しました。`,true);displayPanel('shift');save();}
function birthdayEdit(id){const c=S.staff.find(x=>x.id===Number(id)&&!x.quit);if(!c)return;const max=S.maxTurns;showModal('🎂 '+clean(c.name)+'の誕生日を設定',`<p class="small">🎀 誕生日はオーナーが自由に決められます。今の経営期間（${max}日間）から日付を選んでね。生誕祭は誕生日の前後3日以内に開催できます。</p><label class="field">誕生日<select id="birthday-day">${Array.from({length:max},(_,i)=>`<option value="${i+1}" ${c.birthdayDay===i+1?'selected':''}>${dateLabel(i)}（${i+1}日目）</option>`).join('')}</select></label>${btn('この日に決定する','birthdaySave:'+c.id,'primary block')}${btn('やめる','closeModal','line block')}`);}
function birthdaySave(id){const c=S.staff.find(x=>x.id===Number(id)&&!x.quit),day=Number($('#birthday-day')?.value);if(!c||!Number.isInteger(day)||day<1||day>S.maxTurns)return;c.birthdayDay=day;S.story.push(`${S.turn+1}日目：${c.name}の誕生日を${dateLabel(day-1)}に設定`);closeModal();displayPanel('girls');save();toast(`🎂 ${c.name}の誕生日を${dateLabel(day-1)}に設定したよ！`);}

function planOpen(index){const opts=[['コスプレDAY',12000],['新人イベント',16000],['生誕祭',30000],['周年祭',38000],['売上達成記念',20000],['卒業イベント',18000]];const o=opts[index];if(!o||S.turn<10)return;const candidates=S.staff.filter(c=>!c.quit);const days=Array.from({length:Math.min(7,S.maxTurns-S.turn-1)},(_,i)=>S.turn+i+2);if(!days.length){toast('最終日なので新しいイベントは予約できません');return;}const isBirthday=o[0]==='生誕祭';const bdayHelp=isBirthday?`<p class="small">🎂 主役の誕生日はこの画面でオーナーが設定できます。誕生日の前後3日以内に開催してね。誕生日はキャスト管理からも変更可能です。</p><label class="field">🎂 主役の誕生日（登録）<select id="plan-birthday">${Array.from({length:S.maxTurns},(_,i)=>`<option value="${i+1}">${dateLabel(i)}（${i+1}日目）</option>`).join('')}</select></label>`:'';showModal('🎉 '+o[0]+'を企画',`<p class="small">費用 ${money(o[1])}。${isBirthday?'主役の推し客が集まり、シャンパンやチェキで盛り上がる特別な日！':'イベント当日は大きな売上チャンス！'} 連続開催するとお客さんのお財布が厳しくなります。</p><label class="field">開催日<select id="plan-day">${days.map(d=>`<option value="${d}">${dateLabel(d-1)}（${d}日目）</option>`).join('')}</select></label><label class="field">主役<select id="plan-cast"><option value="">お店全体</option>${candidates.map(c=>`<option value="${c.id}" ${isBirthday&&c.birthdayDay?'data-birthday="'+c.birthdayDay+'"':''}>${clean(c.name)}${c.birthdayDay?' 🎂'+dateLabel(c.birthdayDay-1):''}</option>`).join('')}</select></label>${bdayHelp}<p class="small">🌷 企画確定時、主役のシフトも確保します。体調不良や退職などで当日出勤できなくなる場合はあります。</p>${btn('この内容で予約する','planBook:'+index,'primary block')}${btn('やめる','closeModal','line block')}`);if(isBirthday){const castSelect=$('#plan-cast'),birthdaySelect=$('#plan-birthday'),daySelect=$('#plan-day');if(candidates.length){castSelect.value=String(candidates[0].id);birthdaySelect.value=String(candidates[0].birthdayDay||Number(daySelect.value));}castSelect.addEventListener('change',()=>{const c=candidates.find(x=>String(x.id)===castSelect.value);birthdaySelect.value=String(c?.birthdayDay||Number(daySelect.value));});}}

function planBook(index){const opts=[['コスプレDAY',12000],['新人イベント',16000],['生誕祭',30000],['周年祭',38000],['売上達成記念',20000],['卒業イベント',18000]];const o=opts[index],day=Number($('#plan-day')?.value),cid=Number($('#plan-cast')?.value||0),c=S.staff.find(x=>x.id===cid&&!x.quit);if(!o||S.turn<10||!Number.isInteger(day)||day<S.turn+2||day>S.turn+8||day>S.maxTurns)return;if((S.plannedEvents||[]).filter(x=>!x.done).length>=2){toast('予約は最大2件までです');return;}if(S.plannedEvents.some(x=>x.day===day)){toast('同じ日に複数の企画は開催できません');return;}if(S.cash<o[1]){toast('企画費用が足りません');return;}if(['生誕祭','新人イベント','卒業イベント'].includes(o[0])&&!c){toast('この企画には主役のキャストを選んでね');return;}if(o[0]==='生誕祭'){const bday=Number($('#plan-birthday')?.value);if(!c||!Number.isInteger(bday)||bday<1||bday>S.maxTurns){toast('主役の誕生日を設定してね');return;}if(Math.abs(day-bday)>3){toast('🎂 生誕祭は誕生日の前後3日以内に開催してね');return;}c.birthdayDay=bday;}S.cash-=o[1];S.profitTotal-=o[1];S.plannedEvents.push({day,kind:o[0],cast:c?.name||'',cid:c?.id||null,cost:o[1],done:false});if(c){S.shiftPlan[day]=S.shiftPlan[day]||{};S.shiftPlan[day][c.id]=true;}S.story.push(`${S.turn+1}日目：${o[0]}を${day}日目に予約`);closeModal();toast(`${dateLabel(day-1)}に${o[0]}を予約しました！`);render();}

function executePlannedEvent(){const list=(S.plannedEvents||[]).filter(e=>!e.done&&e.day===S.turn+1);for(const ev of list){ev.done=true;const c=S.staff.find(x=>x.id===ev.cid&&!x.quit);const fatigue=clamp(S.eventFatigue||0);const birthday=ev.kind==='生誕祭';let boost=Math.round((ev.cost*1.4+rand(6000,26000))*(1-fatigue/145));if(birthday&&c){const fanPower=Math.min(42000,Math.round((c.fans||0)*1200));const starPower=Math.round(Math.max(1,c.sales/25000)*1800);const guestBoost=Math.round((12000+fanPower+Math.min(20000,starPower)+rand(4000,17000))*(1-fatigue/165));const champagne=Math.max(1,Math.round((2+Math.min(5,c.fans/6)+Math.random()*3)*(1-fatigue/155)));const champagneSales=champagne*rand(8000,13500);boost+=guestBoost+champagneSales;c.sales+=Math.round(boost*.78);c.fans+=rand(1,4);modify(c,{trust:5,motivation:8,stress:4});S.visitors+=Math.max(3,Math.round(guestBoost/3800));log(`🎂✨ ${c.face} ${c.name}生誕祭！ 店内はお祝いのお客さんでいっぱい♡`,true);log(`🎊 『${c.name}ちゃん、お誕生日おめでとう〜！』 シャンパンコール！ 🍾×${champagne}`,true);log(`💗 ${c.name}の推し客が集まり、チェキやお祝いの注文が続いています！`,true);S.story.push(`${S.turn+1}日目：${c.name}の生誕祭でシャンパン${champagne}本！`);}else if(ev.cid&&!c){boost=Math.round(boost*.4);log('💔 主役が不在でイベント規模を縮小しました。',true);}S.dayRevenue+=boost;S.visitors+=Math.max(1,Math.round(boost/4000));S.popularity=clamp(S.popularity+(birthday?(fatigue>45?2:6):(fatigue>45?1:4)));S.eventFatigue=clamp(fatigue+(ev.cost>=30000?35:20));log(`🎉 ${ev.kind}${ev.cast?'（'+ev.cast+'）':''}開催！ 特別売上＋${money(boost)}♡`,true);S.story.push(`${S.turn+1}日目：${ev.kind}を開催`);}}

function incident(type){if(S.eventPending)return;let c=pick(activeGirls());if(!c)return;clearTimers();if(type==='break'){S.eventPending={type:'break',id:c.id};showModal('🍾 ガシャーン！',`<p>安いお酒の瓶が割れてしまいました。</p><p>💸 片付け・破損費用 −800円</p>${btn('OK・営業再開','incidentOk','primary block')}`);return;}triggerMainEvent();}

function handleAction(act){if(act.startsWith('birthday:')){birthdayEdit(act.split(':')[1]);return;}if(act.startsWith('birthdaySave:')){birthdaySave(act.split(':')[1]);return;}if(act.startsWith('planOpen:')){planOpen(Number(act.split(':')[1]));return;}if(act.startsWith('planBook:')){planBook(Number(act.split(':')[1]));return;}if(act==='incidentOk'){S.cash-=800;S.profitTotal-=800;S.eventPending=null;closeModal();log('🍾 お酒が割れ、800円の損失が発生しました。',true);if(S.phase==='during')startTick();return;}if(act.startsWith('shiftAsk:')||act.startsWith('shiftOff:')){let [k,id]=act.split(':');setShift(id,k==='shiftAsk'?'ask':'off');return;}if(act==='new'){if(S&&!S.finished&&!confirm('現在の進行を消して、はじめから遊びますか？'))return;startNew();return;}if(act==='continue'){if(load())render();else home();return;}if(!S)return;if(act==='setupBack'){S.step=Math.max(0,S.step-1);render();return;}if(act==='setupNext'){if(S.step===0){let a=$('#owner')?.value.trim();if(!a){toast('オーナー名を入力してね');return;}S.owner=a;}if(S.step===1){let a=$('#store')?.value.trim();if(!a){toast('店名を入力してね');return;}S.store=a;S.concept=$('#concept')?.value||S.concept;if(S.concept==='オリジナル')S.concept=$('#customconcept')?.value.trim()||'オリジナル';}if(S.step===3){let a=$('#opendate')?.value;if(!a){toast('開店日を選んでね');return;}S.openDate=a;}if(S.step===4){S.rivals=createRivals(S.place);S.mode='tutorial';render();return;}S.step++;render();return;}if(act==='tutorialBack'){S.mode='setup';S.step=4;render();return;}if(act==='tutorialDone'){S.mode='hire';createApplications(true);render();return;}if(act==='open'){if(!S.staff.length){toast('開店には1人以上の採用が必要です');return;}openGame();return;}if(act.startsWith('accept:')||act.startsWith('reject:')){let [a,id]=act.split(':'),c=S.applications.find(x=>x.id===+id);if(c&&!c.decided){c.decided=a==='accept'?'yes':'no';if(a==='accept'){c.salary=S.wage;S.staff.push(c);}}render();return;}if(act==='begin'){beginDay();return;}if(act==='pause'){S.playSpeed=S.playSpeed===0?1:0;playView();return;}if(act==='speed'){S.playSpeed=S.playSpeed===3?1:3;playView();return;}if(act==='close'){closeDay();return;}if(act==='report'){reportView();return;}if(act==='next'){advance();return;}if(act.startsWith('panel:')){displayPanel(act.slice(6));return;}if(act.startsWith('task:')){chooseTask(act.slice(5));return;}if(act.startsWith('hireLater:')||act.startsWith('skipLater:')){let [a,id]=act.split(':'),c=S.applications.find(x=>x.id===+id);if(c&&!c.decided){c.decided=a==='hireLater'?'yes':'no';if(a==='hireLater'){c.salary=S.wage;S.staff.push(c);S.logs.push({text:`🎀 ${c.name}を新たに採用しました！`,special:true});}save();displayPanel('jobs');}return;}if(act.startsWith('event:')){resolveEvent(act.split(':')[1]);return;}if(act.startsWith('talk:')){talk(act.slice(5));return;}if(act==='closeModal'){closeModal();return;}}
document.addEventListener('click',e=>{let t=e.target.closest('[data-act]');if(t){handleAction(t.dataset.act);return;}let p=e.target.closest('[data-place]');if(p){S.place=p.dataset.place;render();return;}let w=e.target.closest('[data-wage]');if(w){S.wage=+w.dataset.wage;render();return;}let b=e.target.closest('[data-back]');if(b){S.back=b.dataset.back;render();return;}let task=e.target.closest('[data-modal-task]');if(task){let [id,i]=task.dataset.modalTask.split(':');taskDo(id,i);return;}let ord=e.target.closest('[data-order]');if(ord){let [n,m]=ord.dataset.order.split(':').map(Number);if(S.cash<m){toast('資金が足りません');return;}S.cash-=m;S.profitTotal-=m;S.stock+=n;save();displayPanel('order');toast(`${n}個発注しました！`);return;}});
document.addEventListener('change',e=>{if(e.target.id==='concept'){S.concept=e.target.value;let el=$('#customwrap');if(el)el.style.display=S.concept==='オリジナル'?'':'none';}if(e.target.matches('[data-rule]')){let key=e.target.dataset.rule,val=e.target.value;S.rules[key]=val;for(let c of S.staff.filter(x=>!x.quit)){if(key==='safety')modify(c,{trust:val==='厳しく対応'?5:-9,stress:val==='厳しく対応'?-3:5});if(key==='quota')modify(c,{motivation:val==='あり'?(c.personality==='負けず嫌い'?6:-3):3,stress:val==='あり'?5:-3});if(key==='sns')modify(c,{trust:val==='投稿前に確認'?-2:2});if(key==='shift')modify(c,{trust:val==='お店を優先'?-6:3});}save();toast('ルールを変更しました。キャストにも影響します。');}});
if(load()){if(S.phase==='during')S.playSpeed=0;render();}else home();})();</script></body></html>
