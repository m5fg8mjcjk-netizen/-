function makeCandidate(name){let base=fixed[name],p=base?structuredClone(base):null;const personality=p?.personality||extraPersonalities[name]||pick(temper), likes=p?.likes||[pick(jobs)],bad=p?.bad||[pick(jobs.filter(j=>!likes.includes(j)))],relief=p?.relief||pick(jobs.filter(j=>!bad.includes(j))),good=p?.good||[pick(jobs.filter(j=>!bad.includes(j)))];let stats=p?.stats||Array.from({length:5},()=>rand(0,3));let pr=p?.pr;if(!pr){let start={優しい:'みんなが安心できるお店になるように、優しく接客したいです。',気遣い上手:'周りの様子を見ながら、みんなをサポートしていきたいです。',まじめ:'任されたお仕事は最後まで丁寧に頑張りたいです。',お淑やか:'落ち着いた空間でお客様とお話しできたら嬉しいです。',人見知り:'最初は緊張してしまうと思いますが、少しずつ慣れたいです。',天然:'かわいいものが大好きです！毎日楽しく働けたら嬉しいです！',怒りっぽい:'曲がったことは嫌いです。お客様にも誠実に向き合いたいです。',マイペース:'自分のペースを大切にしながら、お店の役に立ちたいです。',甘え上手:'お客さんに名前を覚えてもらえるように頑張ります♡',負けず嫌い:'何事も一番を目指して一生懸命頑張ります！',明るい:'お店に来たみんなを笑顔にしたいです！',素直:'初めてのこともどんどん吸収して成長したいです。',腹黒:'お客様の気持ちをよく考えた接客が得意だと思います。'}[personality];pr=start+({ビラ配り:'街でお店を知ってもらえるよう頑張りたいです。',ライブ配信:'配信でお店の魅力を伝えていきたいです。',POP作り:'かわいいPOPを作るのが楽しみです。',店内掃除:'きれいなお店にするお手伝いがしたいです。','自撮り・SNS':'自撮りやSNSの発信にも挑戦したいです。','接客に専念':'目の前のお客様を大切にしたいです。'}[likes[0]]||'');}

function createApplications(initial){let used=new Set([...S.staff.map(c=>c.name),...S.applications.map(c=>c.name)]);let v=[];if(initial){v.push(makeCandidate(S.fixedFirst));used.add(S.fixedFirst);}else if(!S.fixedLater&&S.turn>=5){let other=S.fixedFirst==='かんな'?'あおい':'かんな';v.push(makeCandidate(other));used.add(other);S.fixedLater=true;}let cnt=initial?5:Math.max(0,rand(0,2)+(S.popularity>35?1:0)-(S.wage===1200?1:0)-(S.back==='なし'?1:0));if(!initial&&v.length)cnt=Math.max(cnt,1);while(v.length<cnt){let pool=names.filter(n=>!used.has(n));if(!pool.length)break;let name=pick(pool);used.add(name);v.push(makeCandidate(name));}S.applications=v;}
function createRivals(place){const base=place==='都会'?67:place==='地方'?35:49;return [{name:'シュガードール',score:base+7,base:base+7},{name:'月夜のアリス',score:base+14,base:base+14},{name:'ほしぞらメイド',score:base-3,base:base-3}];}
function normalizeRivals(arr,place){if(!Array.isArray(arr)||!arr.length)return createRivals(place);const base=createRivals(place);return base.map((r,i)=>({...r,score:clamp(Math.round(arr[i]?.score??r.score),0,100)}));}
function customerSatisfaction(){const penalty=(S.customerDifficulty||0);return clamp(Math.round(S.review-penalty),0,100);}
function castSatisfaction(){const members=S.staff.filter(c=>!c.quit);if(!members.length)return 0;let average=members.reduce((sum,c)=>sum+(c.trust*.48+c.motivation*.42+(100-c.stress)*.10),0)/members.length;return clamp(Math.round(average-(S.staffDifficulty||0)),0,100);}
function rankingScore(){const cashHealth=clamp(50+S.profitTotal/25000,0,100);return clamp(Math.round(S.popularity*.42+customerSatisfaction()*.23+castSatisfaction()*.22+cashHealth*.13),0,100);}
function rankings(){return [{name:S.store||'あなたのお店',score:rankingScore(),player:true},...S.rivals.map(r=>({...r,player:false}))].sort((a,b)=>b.score-a.score);}
function rankingView(){const rows=rankings();return `<p class="small">地域：${S.place} ／ 都会ほど競合店の初期評価と成長が高くなります。順位は営業中も確認できます。</p><div class="stack">${rows.map((r,i)=>`<div class="card row between" style="${r.player?'background:#fff0f7;border-color:#ee87bc':''}"><b>${i+1}位 ${r.player?'🎀 ':i===0?'👑 ':'🏠 '}${clean(r.name)}${r.player?'（あなた）':''}</b><span class="chip">${r.score} / 100</span></div>`).join('')}</div><div class="message">🏆 現在 ${rows.findIndex(x=>x.player)+1}位／${rows.length}店舗。お客様満足度 ${customerSatisfaction()}点・キャスト満足度 ${castSatisfaction()}点・店舗人気 ${Math.round(S.popularity)}点。どれも100点を目指そう！</div>`;}
function updateRivals(){const placePower=S.place==='都会'?1.5:S.place==='地方'?.62:1;const progress=(S.turn+1)/S.maxTurns;S.rivals.forEach((r,i)=>{const drift=(Math.random()-.41)*3.3*placePower;const target=(r.base??r.score)+progress*(S.place==='都会'?17:S.place==='地方'?8:12);r.score=clamp(Math.round(r.score*.78+target*.22+drift),0,100);});}
function traitEffect(c){return { '敏腕':{sales:1.28,quote:'お客様の好み、ちゃんと覚えてますよ♡'},'愛され体質':{sales:1.08,quote:'また会いに来てくれたんですね♡'},'気配り上手':{sales:1.07,quote:'お席の様子を見てきますね'},'遅刻魔':{sales:0.86,quote:'すみません、少し遅れちゃいました……'},'サボり癖':{sales:0.88,quote:'ちょっとだけ休憩したいな〜'},'努力家':{sales:1.05,quote:'もっと接客が上手になりたいです！'},'メンヘラ':{sales:1.15,quote:'今日は私のこと、見ててね♡'},'ザル':{sales:1.13,quote:'みんなの接客もフォローしますね♡'}}[c.trait]||{sales:1,quote:''};}
function pairConflict(a,b){return (S.shiftExclusions||[]).some(p=>(p[0]===a.id&&p[1]===b.id)||(p[0]===b.id&&p[1]===a.id));}
function enforceShiftExclusions(day){const on=S.staff.filter(c=>c.shift&&!c.quit&&!c.absence);for(const pair of S.shiftExclusions||[]){let a=on.find(c=>c.id===pair[0]),b=on.find(c=>c.id===pair[1]);if(a&&b){const overrides=S.shiftPlan[day]||{};const priorityA=overrides[a.id]===true?2:0,priorityB=overrides[b.id]===true?2:0;const remove=priorityA>priorityB?b:priorityB>priorityA?a:a.motivation>=b.motivation?b:a;remove.shift=false;S.shiftPlan[day]=S.shiftPlan[day]||{};S.shiftPlan[day][remove.id]=false;}}S.nextShifts=S.staff.filter(c=>c.shift&&!c.quit&&!c.absence).map(c=>c.name);}
function shiftGenerate(){let day=S.turn;let active=S.staff.filter(c=>!c.quit&&c.absence<=0&&(!c.suspendedUntil||day>=c.suspendedUntil));let attendance=active.filter(c=>Math.random()<Math.min(.92,Math.max(.32,c.desired/7+.15))&&!(c.stress>88&&Math.random()<.55));if(!attendance.length&&active.some(c=>c.stress<92))attendance=[active.filter(c=>c.stress<92).sort((a,b)=>b.motivation-a.motivation)[0]];S.staff.forEach(c=>{c.shift=attendance.some(a=>a.id===c.id);if(S.shiftPlan[day]&&Object.hasOwn(S.shiftPlan[day],c.id))c.shift=active.includes(c)&&S.shiftPlan[day][c.id];});enforceShiftExclusions(day);}
function activeGirls(){return S.staff.filter(c=>c.shift&&!c.quit&&!c.absence);}

rites();if(S.phase==='during'&&!S.autoSession)startTick();}
function sceneControls(){if(S.autoSession)return '<span class="chip lav">🎀 リーダーにおまかせ中</span>';if(S.phase==='before')return `${btn('🌙 営業スタート','begin','primary')}${btn('📅 シフト表','panel:shift','line')}`;if(S.phase==='during')return `${btn(S.playSpeed===0?'▶ 再開':'⏸ 一時停止','pause','alt')}${btn('⏩ 2倍速 '+(S.playSpeed===3?'ON':'OFF'),'speed','line')}${btn('🌃 閉店する','close','primary')}`;return btn('📊 営業報告を見る','report','primary');}

function drawSprites(){let el=$('#sprites');if(!el)return;let g=activeGirls().slice(0,9);let customers=S.phase==='during'?Math.min(4,Math.floor(S.visitors/2)%5):0;el.innerHTML=g.map((c,i)=>`<div class="sprite" data-sprite="${c.id}" style="--x:${(i%4)*20+8}%;--y:${-(i%3)*25-17}px"><div class="bubble">${icon[c.task]||'💬'}</div><div class="face">${c.face}</div><div class="spriteName">${clean(c.name)}</div></div>`).join('')+Array.from({length:customers},(_,i)=>`<div class="sprite customer" data-c="${i}" style="--x:${52+i*11}%;--y:${-60+(i%2)*20}px"><div class="face">${['🧑','👨','👤','🧑🏻'][i]}</div><div class="spriteName">お客さん</div></div>`).join('');}

function startTick(){clearTimers();if(S.playSpeed===0||S.eventPending||overlay.querySelector('.modalback'))return;tick=setInterval(()=>{if(S.phase!=='during'||S.eventPending||overlay.querySelector('.modalback'))return;S.clock++;let hr=18+Math.floor(S.clock/5),mn=(S.clock%5)*12;let el=$('#clock');if(el)el.textContent=`${String(Math.min(hr,23)).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;stepActivity();if(S.clock%2===0)moveSprites();if(S.clock>=25)closeDay();},S.playSpeed===3?300:650);}
function addSale(amount,c,kind){S.dayRevenue+=amount;S.stock=Math.max(0,S.stock-(kind==='ドリンク'||kind==='フード'?1:0));if(c){c.sales+=amount;c.fans+=Math.random()<.18?1:0;}S.orders++;}
function stepActivity(){let g=activeGirls();if(!g.length){if(Math.random()<.3)log('店内にキャストがいないため、営業できません。');return;}let c=pick(g);const p=Math.random();if(S.clock%6===0&&Math.random()<.23){let job=pick(c.likes||['接客に専念']);log(`🌷 ${c.name}「少し時間ができたから、${job}しておこうかな♡」`);if(job==='店内掃除')S.cleanliness=clamp(S.cleanliness+3);else if(job==='POP作り')S.popularity=clamp(S.popularity+1);else if(job==='ライブ配信'||job==='自撮り・SNS')S.visitors+=S.place==='都会'?2:1;else if(job==='接客に専念')addSale(800,c,'チェキ');}if(S.clock>4&&!S.eventPending){if(triggerBadCustomerResignation())return;if(!S.drinkToday&&g.some(c=>c.age>=20&&c.trait!=='ザル')&&Math.random()<.0025){const c=pick(g.filter(c=>c.age>=20&&c.trait!=='ザル'));S.drinkToday=true;S.eventPending={type:'drunk',id:c.id};showModal('🍹 キャストが酔い潰れました！',`<p>${clean(c.name)}がお酒で体調を崩してしまいました。安全を確保して休ませましょう。</p>${btn('体調を確認して帰宅させる','drunk:home','primary block')}${btn('必要な医療対応を行う','drunk:medical','line block')}`);return;}if((S.harassmentCooldown||0)===0&&(S.harassmentToday||0)===0&&g.length>=2&&g.some(x=>x.trait==='嫉妬深い')&&Math.random()<.032){const bully=pick(g.filter(x=>x.trait==='嫉妬深い'));const victims=g.filter(x=>x.id!==bully.id);if(victims.length){S.harassmentToday=1;S.harassmentCooldown=rand(4,8);openHarassment(bully,pick(victims));return;}}
 const canMinor=(S.minorEvents||0)<1,canMajor=(S.majorEvents||0)<1 && (S.eventCooldown||0)===0;
 if(canMinor&&Math.random()<.012){S.minorEvents=(S.minorEvents||0)+1;incident('break');return;}
 if(canMajor&&Math.random()<.022){S.majorEvents=(S.majorEvents||0)+1;S.eventCooldown=rand(3,5);incident('major');return;}
 }if(p<.32){let kind=pick(['ドリンク','チェキ','フード','ボトル']);if(S.stock<=0&&['ドリンク','フード'].includes(kind)){log('📦 在庫が不足して注文を受けられませんでした……');return;}let amount={ドリンク:1200,チェキ:1200,フード:1500,ボトル:rand(1,4)*10000}[kind];let mult=c.task==='接客に専念'?1:0.52;let rate=(.55+.12*c.stats[4])*(.55+c.motivation/120)*mult*traitEffect(c).sales;if(Math.random()<Math.min(.91,rate)){addSale(amount,c,kind);log(`🍾 ${c.name}が${kind}の注文を獲得！ +${money(amount)}`);S.review=clamp(S.review+.4);}else log(`${c.name}が接客中。お客さんとお話ししています。`);}else if(p<.53){let arrivals=Math.max(0,Math.round((S.place==='都会'?3:S.place==='地方'?1:2)*(1+S.popularity/80)*Math.random()));S.visitors+=arrivals;if(arrivals)log(`🚪 お客さんが${arrivals}人来店しました！`);else log(`☕ ${c.name}が店内を見回っています。`);drawSprites();}else if(p<.77){let lines=c.personality==='まじめ'?['お仕事、きちんとやらないと……','今日も頑張ります！']:c.personality==='天然'?['えへへ、たのしいですね〜！','あれ？さっき何してたっけ？']:['今日も頑張ろう！','お客さんとのお話、楽しいな'];log(`💬 ${c.name}「${pick(lines)}」`);}else{if(Math.random()<.35){let gain=rand(1,3)+(c.trait==='敏腕'?1:0);S.popularity=clamp(S.popularity+gain);log(`📱 ${c.name}のおかげでお店の投稿が注目されています！ 人気+${gain}`,true);}else log(`✨ ${c.name}が${c.task}に取り組んでいます。${traitEffect(c).quote?' '+traitEffect(c).quote:''}`);}}

function taskDo(id,idx){let c=S.staff.find(x=>x.id===+id),job=jobs[+idx];if(!c||!job||c.assigned>=2)return;let state=phen(c,job),isBad=c.bad.includes(job),relief=job===c.relief,liked=c.likes.includes(job),good=c.good.includes(job);let start,end;if(isBad){start=pick(['えっ……それは少し苦手なんですけど……','うぅ、ちょっと緊張します……','正直、別のお仕事の方がありがたいです……']);end=pick(['思っていたより疲れちゃいました……','頑張ったけど、結構しんどかったです……']);modify(c,{stress:rand(12,19),trust:c.trust>=70?1:-3,motivation:-3});}else if(relief){start=pick(['これ、落ち着くんですよね。','そのお仕事なら嬉しいです！','ふふ、気分転換になりそう。']);end=pick(['なんだかスッキリしました！','疲れが取れた気がします♡']);modify(c,{stress:-rand(10,17),trust:2,motivation:3});}else if(liked){start=pick(['やった！これ好きなんです！','このお仕事、楽しいんですよね♡']);end=pick(['今日も楽しかったです！','また任せてくださいね。']);modify(c,{stress:-2,trust:2,motivation:4});}else if(good){start=pick(['これなら自信があります！','私に任せてください！']);end=pick(['うまくできたと思います！','得意なことが役立って嬉しいです。']);modify(c,{trust:2,motivation:2});}else{start=pick(['はい、やってみます！','分かりました！','了解です！']);end=pick(['終わりました！','こんな感じで大丈夫でしょうか？']);modify(c,{stress:2});}
c.recentJobs=c.recentJobs||[];let repeat=c.recentJobs.filter(x=>x===job).length;if(repeat){modify(c,{stress:repeat*5,trust:c.trust<35?-2:0});if(repeat>=2)log(`💬 ${c.name}「このお仕事、最近ずっと続いてますね……」`);}c.recentJobs.push(job);c.recentJobs=c.recentJobs.slice(-4);if(relief&&repeat)modify(c,{stress:Math.min(12,repeat*5)});if(c.trust<30)log(`💬 ${c.name}「……また私にお願いするんですか？」`);c.assigned++;c.task=job;c.known[job]=state;if(job==='店内掃除'){S.cleanliness=clamp(S.cleanliness+rand(12,20));S.cleanedTurn=S.turn;S.uncleanDays=0;}if(job==='POP作り')S.popularity=clamp(S.popularity+rand(1,3));if(job==='ライブ配信'||job==='自撮り・SNS'){S.popularity=clamp(S.popularity+rand(1,4)*(1+c.stats[3]/3));}if(job==='ビラ配り')S.visitors+=rand(0,2)*(1+Math.floor(c.stats[0]/2));if(job==='接客に専念')S.dayRevenue+=rand(0,500)*(1+c.stats[4]);let statix={'ビラ配り':0,'ライブ配信':3,'POP作り':3,'店内掃除':2,'自撮り・SNS':3,'接客に専念':4}[job];let effort=(isBad&&c.trust>=65?18:isBad?5:relief?6:liked?12:good?15:8)+(c.trait==='努力家'?5:0);c.xp[statix]+=effort;if(c.stats[statix]<3&&c.xp[statix]>=50){c.xp[statix]-=50;c.stats[statix]++;growthNotice(c,statix,rank(c.stats[statix]-1),rank(c.stats[statix]));}log(`📋 ${c.name}に「${job}」を指示しました。`,true);log(`💬 ${c.name}「${start}」`);log(`💬 ${c.name}「${end}」`);if(c.stress>75)S.hints.push({name:c.name,kind:'stress',text:`${c.name}ちゃん、最近疲れているらしい……`,turn:S.turn});closeModal();toast(`${c.name}：${job}完了`);playView();}

function openGame(){let openDate=S.openDate;S.mode='play';S.phase='before';S.day=1;S.turn=0;S.staff.forEach(c=>{c.shift=true;c.salary=S.wage;c.assigned=0;});S.logs=[{text:`🎀 ${S.store} がグランドオープン！ 採用したキャストは全員出勤！`,special:true}];S.nextShifts=S.staff.map(c=>c.name);render();}
function noteOwnerExcluded(c, day){
 if(!c||c.quit)return;
 if(!Array.isArray(c.ownerExcludedDays))c.ownerExcludedDays=[];
 if(!c.ownerExcludedDays.includes(day))c.ownerExcludedDays.push(day);
 c.ownerExcludedDays=c.ownerExcludedDays.filter(d=>d>=day-8&&d<=day);
 const last5=Array.from({length:5},(_,i)=>day-i);
 if(day>=4&&last5.every(d=>c.ownerExcludedDays.includes(d))){
  c.quit=1;c.shift=false;
  S.nextShifts=(S.nextShifts||[]).filter(n=>n!==c.name);
  const message=`💔 ${c.name}は5日連続でオーナーからシフトを外され、「もう必要とされていないんですね……」と自主退職しました。`;
  S.story.push(`${day+1}日目：${c.name}が連続シフト外しで退職`);
  log(message,true);S.noticeQueue.push(message);
  return true;
 }
 return false;
}
function checkOwnerExclusions(day){
 for(const c of S.staff.filter(x=>!x.quit)){
  // 出勤不可（休暇・病欠・通常の希望休・欠勤）はカウントしない。
  const excluded=S.shiftPlan?.[day]?.[c.id]===false;
  if(excluded)noteOwnerExcluded(c,day);
  else c.ownerExcludedDays=[];
 }
}

function leaderCleaning(){

 const chance=guaranteed?1:c.trait==='サボり癖'?.15:c.trait==='飽き性'?.25:c.trait==='面倒見がいい'||c.trait==='気配り上手'?.8:.6;
 const cleanNow=Math.random()<chance;
 const o=S.leaderCleanObservations[c.id]||(S.leaderCleanObservations[c.id]={done:0,miss:0});
 if(cleanNow){S.cleanedTurn=S.turn;S.uncleanDays=0;S.cleanliness=clamp(S.cleanliness+23);o.done++;log(`🧹 リーダー${c.name}の判断で店内を清掃しました！`,true);}

}
function cleanlinessReview(){
 if(!S.environmentReported)S.environmentReported={};
 if(!S.soloDays)S.soloDays={};
 const cleaned=S.cleanedTurn===S.turn;
 S.uncleanDays=cleaned?0:(S.uncleanDays||0)+1;
 if(!cleaned)S.cleanliness=clamp(S.cleanliness-30);
 if(S.uncleanDays>=2)S.cleanliness=Math.min(S.cleanliness,40);
 S.dirtyDays=S.cleanliness<=50?(S.dirtyDays||0)+1:0;
 S.stockDays=S.stock<=0?(S.stockDays||0)+1:0;
 const problems=[];
 if(S.uncleanDays>=2&&!S.environmentReported.clean){problems.push('2営業日連続で掃除されていません');S.environmentReported.clean=true;}
 if(S.dirtyDays>=2&&!S.environmentReported.dirty){problems.push('清潔度50以下が2営業日続いています');S.environmentReported.dirty=true;}
 if(S.stockDays>=2&&!S.environmentReported.stock){problems.push('在庫切れが2営業日続いています');S.environmentReported.stock=true;}
 if(cleaned){delete S.environmentReported.clean;}
 if(S.cleanliness>50)delete S.environmentReported.dirty;
 if(S.stock>0)delete S.environmentReported.stock;
 if(problems.length){
  S.staff.filter(c=>!c.quit).forEach(c=>modify(c,{trust:-20,motivation:-20}));
  S.review=clamp(S.review-5);
  const msg=`🚨 キャストからクレーム！ ${problems.join('／')}。全員の信頼度・やる気が20低下しました。`;
  log(msg,true);S.noticeQueue.push(msg);S.story.push(`${S.day}日目：${msg}`);
 }
 const present=activeGirls();
 if(present.length===1){const c=present[0];const k=String(c.id);S.soloDays[k]=(S.soloDays[k]||0)+1;
  if(S.soloDays[k]===2){modify(c,{stress:12,trust:-10,motivation:-10});const msg=`🚨 ${c.name}から人手不足のクレーム！「2日連続で私1人では大変です……」`;log(msg,true);S.noticeQueue.push(msg);}}
 else S.soloDays={};
}

function reportView(){let e=S.lastEnd;if(!e)return;showModal('🌙 本日の営業報告',`<div class="grid"><div class="card">💰 総売上<h2>${money(e.income)}</h2></div><div class="card">💸 経費<h2>${money(e.expense)}</h2></div><div class="card">🌸 営業収支<h2 class="money ${e.margin<0?'minus':'plus'}">${money(e.margin)}</h2></div><div class="card">👤 来店数<h2>${e.visitors}人</h2></div></div><h3 style="margin-top:15px">🗣️ 今日の噂</h3>${e.rumors.length?e.rumors.map(r=>`<div class="message">「${clean(r.text)}」</div>`).join(''):'<p class="small">今日は特に噂はありませんでした。</p>'}<h3 style="margin-top:15px">📅 明日のシフト</h3><div class="message">${S.nextShifts.length?S.nextShifts.map(n=>`✅ ${clean(n)}`).join(' ／ '):'出勤予定なし'}</div>${btn('シフトを調整する','panel:shift','alt block')}${btn(S.turn===S.maxTurns-1?'🏆 最終結果を見る':'☀️ 翌日へ進む','next','primary block')}`);}
function advance(){closeModal();if(S.turn>=S.maxTurns-1){finish();return;}S.turn++;S.day=S.turn+1;S.eventCooldown=Math.max(0,(S.eventCooldown||0)-1);S.harassmentCooldown=Math.max(0,(S.harassmentCooldown||0)-1);S.eventFatigue=Math.max(0,(S.eventFatigue||0)-5);let g=S.staff.filter(c=>!c.quit);for(let c of g){c.absence=Math.max(0,c.absence-1);modify(c,{stress:-rand(2,6),motivation:rand(-2,3)});if(c.trait==='飽き性'&&c.tenure>=6&&Math.random()<(c.stress>55?.075:.035)){c.quit=1;c.shift=false;S.logs.push({text:`💨 ${c.name}は『毎日同じ仕事に飽きちゃった……』と言い残し、突然お店を去りました。`,special:true});S.story.push(`${S.day}日目：${c.name}が飽きて突然退職`);S.noticeQueue.push(`💨 ${c.name}がマンネリを理由に突然退職しました。`);}else if(c.stress>91&&c.trust<38&&Math.random()<.08){c.absence=rand(2,4);S.logs.push({text:`💨 ${c.name}から連絡が取れず、しばらく出勤できないようです。`,special:true});S.story.push(`${S.day}日目：${c.name}が無断欠勤`);}else if(c.stress>94&&c.trust<18&&Math.random()<.035){c.quit=1;S.logs.push({text:`🎓 ${c.name}が突然退職しました……`,special:true});S.story.push(`${S.day}日目：${c.name}が退職`);}}if(S.turn===29||S.turn===59){let rent=S.place==='地方'?50000:S.place==='地元'?120000:300000;S.cash-=rent;S.profitTotal-=rent;S.logs.push({text:`🏠 家賃${money(rent)}を支払いました。`,special:true});}if(!S.fixedLater&&S.turn>=7){createApplications(false);S.logs.push({text:'📩 固定キャストを含む求人応募が届きました！',special:true});}else if(S.turn%5===0||S.staff.filter(c=>!c.quit).length===0){createApplications(false);if(S.applications.length)S.logs.push({text:`📩 求人への応募が${S.applications.length}件届きました！`,special:true});}S.logs=S.logs.slice(-100);S.phase='before';updateRivals();shiftGenerate();if(S.turn%10===0){S.story.push(`${S.day}日目：店舗人気${Math.round(S.popularity)}、累計売上${money(S.salesTotal)}`);}if(S.cash<=-100000){finish(true);return;}render();}
function openHarassment(bully,victim){clearTimers();const witness=S.staff.filter(x=>x.shift&&!x.quit&&x.id!==bully.id&&x.id!==victim.id);let source=victim.trait==='敏腕'?'self':pick(['self','owner',...(witness.length?['witness']:[]),'rumor']);if(victim.trait!=='敏腕'&&source==='self'&&victim.trust<40)source=witness.length?'witness':'owner';let informer=witness.length?pick(witness):null;const text=source==='self'?`${clean(victim.name)}「店長、${clean(bully.name)}ちゃんから嫌がらせを受けています……」`:source==='owner'?`店長は${clean(bully.name)}が${clean(victim.name)}の持ち物を隠そうとしている場面を目撃しました。`:source==='witness'?`${clean(informer.name)}「店長、${clean(victim.name)}ちゃんが${clean(bully.name)}ちゃんに嫌がらせされているみたいです……」`:`「${clean(victim.name)}ちゃんへの嫌がらせがあるらしい」という噂が届きました。`;S.eventPending={type:'harassment',bullyId:bully.id,victimId:victim.id,source,confirmed:source==='owner'};if(victim.trait!=='鉄のメンタル')modify(victim,{stress:rand(7,16)});else modify(victim,{stress:1});S.story.push(`${S.turn+1}日目：${victim.name}への嫌がらせの${source==='owner'?'現場を目撃':'相談を受けた'}`);showModal(source==='owner'?'🚨 嫌がらせを目撃！':'💔 キャスト間のトラブル',`<p>💬 ${text}</p><p class="small">${source==='owner'?'現場を確認しました。対応を選んでください。':'まず事情を確認して、安全を確保しましょう。'}</p><div class="stack">${source==='owner'?harassmentChoices():btn('🔎 事情を確認する','harassInvestigate','primary block')+btn('📅 先にシフトを分ける','harassSeparateEarly','line block')}</div>`);}
function harassmentChoices(){return [['🚪 嫌がらせした子を解雇','fire'],['😠 説教する','scold'],['💤 数日間の出勤停止','suspend'],['📅 2人のシフトを分ける','separate'],['💬 事情を詳しく聞く','listen']].map(([label,v])=>btn(label,'harassResolve:'+v,'line block')).join('');}
function addShiftSeparation(a,b){if(!S.shiftExclusions)S.shiftExclusions=[];if(!S.shiftExclusions.some(p=>(p[0]===a.id&&p[1]===b.id)||(p[1]===a.id&&p[0]===b.id)))S.shiftExclusions.push([a.id,b.id]);if(a.shift&&b.shift){const loser=a.motivation>=b.motivation?b:a;loser.shift=false;S.shiftPlan[S.turn]=S.shiftPlan[S.turn]||{};S.shiftPlan[S.turn][loser.id]=false;log(`🚫 ${loser.name}を本日のシフトから外しました。`,true);}for(const [day,shifts] of Object.entries(S.shiftPlan)){if(shifts[a.id]===true&&shifts[b.id]===true)shifts[b.id]=false;}enforceShiftExclusions(S.turn);}
function resolveHarassment(action){const ev=S.eventPending;if(!ev||ev.type!=='harassment')return;const bully=S.staff.find(x=>x.id===ev.bullyId),victim=S.staff.find(x=>x.id===ev.victimId);if(!bully||!victim)return;if(action==='investigate'){const evidence=Math.random()<(ev.source==='self'?.76:.61);ev.confirmed=evidence;showModal(evidence?'🔎 嫌がらせが確認されました':'🔎 調査の結果',`<p>${evidence?`${clean(bully.name)}の嫌がらせを確認しました。処分を選んでください。`:'証言が一致せず、嫌がらせを断定できませんでした。まずは安全を確保して見守りましょう。'}</p>${evidence?harassmentChoices():btn('📅 念のためシフトを分ける','harassSeparateEarly','line block')+btn('💬 双方に注意して様子を見る','harassWatch','primary block')}`);return;}if(action==='listen'){modify(victim,{trust:5,stress:-6});showModal('💬 双方から事情を聞きました',`<p>${clean(victim.name)}から状況を聞き、${clean(bully.name)}にも事実確認を行いました。具体的な対応を選んでください。</p>${harassmentChoices()}`);return;}if(!ev.confirmed&&['fire','scold','suspend'].includes(action)){toast('まず事情を確認してください');return;}let msg='';if(action==='fire'){bully.quit=1;bully.shift=false;modify(victim,{trust:13,stress:-12});S.staff.filter(c=>!c.quit).forEach(c=>modify(c,{trust:2}));msg=`${bully.name}を解雇しました。${victim.name}の安心を優先しました。`;}else if(action==='scold'){modify(bully,{trust:-12,stress:7});modify(victim,{trust:4,stress:-3});msg=`${bully.name}に厳しく注意しました。再発防止を見守る必要があります。`;}else if(action==='suspend'){bully.absence=Math.max(bully.absence,3);bully.shift=false;bully.suspendedUntil=S.turn+3;modify(victim,{trust:9,stress:-8});msg=`${bully.name}を3日間の出勤停止にしました。`;}else if(action==='separate'||action==='separateEarly'){addShiftSeparation(bully,victim);modify(victim,{trust:9,stress:-7});msg=`${bully.name}と${victim.name}は、今後同じシフトに入らないよう設定しました。`;}else{modify(victim,{trust:2});msg='双方の様子を見守ることにしました。';}S.eventPending=null;closeModal();log('🚨 '+msg,true);S.story.push(`${S.turn+1}日目：${msg}`);save();playView();if(S.phase==='during')startTick();}
function growthNotice(c,i,oldRank,newRank){const text=`🎉 おめでとう！ ${c.name}の${['会話力','容姿','精神','SNS','営業力'][i]}が${oldRank} → ${newRank}にランクアップ！`;log(text,true);S.growthQueue.push(text);}
function announcements(){if(!S)return;const items=[];if(S.growthQueue.length){items.push(...S.growthQueue.splice(0).map(t=>'🌟 '+t));}if(!S.regularNotice&&S.turn>=5&&S.popularity>=17){S.regularNotice=true;items.push('💗 常連客が増え始めた！ お店にリピーターが定着しています♡');}if(S.turn>=7&&S.turn%8===0){const cur=rankings().findIndex(x=>x.player)+1;if(S.lastRank&&cur<S.lastRank)items.push('🏆 ランキングが'+cur+'位に上昇！');else if(S.lastRank&&cur>S.lastRank)items.push('⚔️ ライバル店が人気を伸ばし、順位が'+cur+'位になりました！');S.lastRank=cur;}S.noticeQueue.push(...items);}
function showNotice(){if(!S||S.eventPending||!S.noticeQueue.length)return false;const items=S.noticeQueue.splice(0,5);showModal(items.some(t=>/クレーム|退職|遅刻|欠勤|🚨/.test(t))?'🚨 お店からのお知らせ':'🎀 うれしいお知らせ！',`<div class="stack">${items.map(t=>`<div class="message">${clean(t)}</div>`).join('')}</div>${btn('確認しました','noticeOk','primary block')}`);return true;}
function passiveGrowth(){let roster=activeGirls();for(const c of roster){if(c.trait==='努力家'&&Math.random()<.48){let i=pick([0,2,3,4]);c.xp[i]+=rand(7,14);log(`📚 ${c.name}は自主的に練習を重ねています。`);}if(c.trait==='面倒見がいい'&&Math.random()<.35){let targets=roster.filter(x=>x.id!==c.id&&x.stats.some(v=>v<3));if(targets.length){let t=pick(targets);let ix=pick(t.stats.map((v,i)=>v<3?i:-1).filter(i=>i>=0));t.xp[ix]+=rand(12,22);log(`🧸 ${c.name}が${t.name}に仕事のコツを教えています！`,true);}}}for(const c of roster){for(let i=0;i<5;i++){if(c.stats[i]<3&&c.xp[i]>=50){c.xp[i]-=50;c.stats[i]++;growthNotice(c,i,rank(c.stats[i]-1),rank(c.stats[i]));S.story.push(`${S.turn+1}日目：${c.name}が成長`);}}}}
function triggerMainEvent(){let g=S.staff.filter(x=>!x.quit);if(!g.length)return;let c=g.slice().sort((a,b)=>b.stress-a.stress)[0];let eventType=c.stress>65?'cry':Math.random()<.45?'graduate':'customer';S.eventPending={id:c.id,type:eventType};let title=eventType==='cry'?'😢 キャストが泣いてしまった！':eventType==='graduate'?'🎓 卒業の相談':'⚠️ 困ったお客さん';let body=eventType==='cry'?`<p>💬 ${c.name}「ごめんなさい……最近ちょっとしんどくて、涙が止まらないです……」</p>`:eventType==='graduate'?`<p>💬 ${c.name}「店長、実はそろそろ卒業しようか悩んでいて……」</p>`:`<p>👤 お客さんが${c.name}にしつこく話しかけています。対応が必要そうです。</p>`;body+=`<div class="stack">${(eventType==='cry'?[['話を聞く','hear'],['今日は帰って休んでもらう','rest'],['原因を解決する','solve'],['励まして戻ってもらう','cheer'],['そのまま働いてもらう','force']]:eventType==='graduate'?[['理由を聞いて相談する','hear'],['待遇改善を提案','pay'],['休暇を提案','rest'],['引き止める','retain'],['卒業を応援する','leave']]:[['厳しく注意して退店してもらう','solve'],['キャストの話を聞く','hear'],['売上を優先して見守る','force']]).map(([l,a])=>btn(l,'event:'+a,'line block')).join('')}</div>`;showModal(title,body);}
function resolveEvent(choice){let ev=S.eventPending;if(!ev)return;let c=S.staff.find(x=>x.id===ev.id);if(!c)return;let msg='';let chance=(c.trust/100*.45)+(1-c.stress/100)*.32+(choice==='hear'||choice==='solve'?.2:choice==='pay'?.14:choice==='rest'?.12:0);if(ev.type==='cry'){if(choice==='solve'||choice==='hear'){modify(c,{trust:12,stress:-rand(10,22)});msg=`${c.name}の話を聞き、問題に向き合いました。少しずつ元気を取り戻しました。`;}else if(choice==='rest'){c.absence=1;modify(c,{stress:-22,trust:8});msg=`${c.name}はしばらくお休みすることになりました。`;}else if(choice==='force'){modify(c,{trust:-23,stress:18});if(Math.random()>.55){c.quit=1;msg=`${c.name}は店を去ってしまいました……`;}else{c.absence=2;msg=`${c.name}はその後しばらく出勤しなくなりました……`;}}else{modify(c,{stress:-4,trust:-4});msg=`${c.name}はなんとか接客に戻りましたが、疲れは残っています。`;}}else if(ev.type==='graduate'){if(choice==='leave'){c.quit=1;msg=`${c.name}の卒業を応援しました。円満な卒業です。`;modify(c,{trust:8});}else if(Math.random()<chance){modify(c,{trust:10,stress:-16,motivation:11});msg=`${c.name}「もう少しここで頑張ってみます……！」引き止めに成功！`;}else{c.quit=1;msg=`${c.name}は卒業を決めました。気持ちは変わりませんでした……`;}}else{if(choice==='force'){modify(c,{trust:-15,stress:23});S.review=clamp(S.review-6);msg='お客さんの問題を放置し、キャストが不安を感じています。';}else{modify(c,{trust:12,stress:-12});S.review=clamp(S.review+2);msg='お客さんに対応し、キャストを守りました。';}}S.eventPending=null;closeModal();log('📣 '+msg,true);toast(msg);render();if(S.autoSession)autoResume();else if(S.phase==='during')startTick();}
function talk(name){if(S.rumorHeard[name]===S.turn){toast('この子には今日はもう聞きました');return;}let c=S.staff.find(x=>x.name===name&&!x.quit);if(!c){toast('現在この子に話を聞けません');return;}let msg=c.stress>65?'最近ちょっと疲れていて……少し休みたいです。':c.trust<35?'正直、お店のやり方で気になっていることがあります。':'話を聞いてくれて嬉しいです！';S.rumorHeard[name]=S.turn;modify(c,{trust:8,stress:-5});closeModal();log(`💬 ${c.name}「${msg}」`,true);toast('話を聞きました。信頼度に変化がありました');}
function finish(bankrupt=false){S.mode='end';S.finished=true;S.score=rankingScore();S.finalRank=rankings().findIndex(r=>r.player)+1;S.finalCustomer=customerSatisfaction();S.finalStaff=castSatisfaction();S.ending=bankrupt?'閉店エンド':S.finalRank===1?'👑 北海道No.1！':S.score>=65?'🌟 北海道の人気店':S.score>=42?'🌸 地元の愛され店':'💔 苦戦したお店';render();}
function endView(){root.innerHTML=`${header()}<section class="panel hero"><div class="large">${S.finalRank===1?'🏆':'🎀'}</div><h2>2か月間の経営、おつかれさま！</h2><h2>${S.ending}</h2><p class="subtitle">目標は4項目すべて最高評価！<br>${clean(S.owner)}オーナーの ${clean(S.store)}</p><div class="grid"><div class="card">💗 お客様満足度<h2>${S.finalCustomer} / 100点</h2></div><div class="card">👧 キャスト満足度<h2>${S.finalStaff} / 100点</h2></div><div class="card">🏆 ライバルランキング<h2>${S.finalRank}位 / ${S.rivals.length+1}店</h2></div><div class="card">🌷 店舗人気度<h2>${Math.round(S.popularity)} / 100点</h2></div></div><div class="message">🌟 全項目最高評価を目指そう！ お客様とキャストの満足度は簡単には100点にならないよ。<br>経営総合評価：<b>${S.score} / 100点</b></div><div class="grid"><div class="card">💰 累計売上<h3>${money(S.salesTotal)}</h3></div><div class="card">📈 最終収支<h3>${money(S.profitTotal)}</h3></div></div><h3 style="margin-top:16px">📖 お店の思い出</h3><div class="message" style="text-align:left">${(S.story||[]).slice(-12).map(x=>`🌷 ${clean(x)}<br>`).join('')||'仲間と過ごした2か月間。'}</div><h3>🏆 最終ランキング</h3>${rankingView()}<div class="controls">${btn('♡ もう一度遊ぶ','new','primary')}</div></section>`;}

function setShift(id,delta){let c=S.staff.find(x=>x.id===+id&&!x.quit);if(!c)return;let d=S.phase==='report'?S.turn+1:S.turn;if(delta==='ask'&&(S.shiftExclusions||[]).some(p=>{let otherId=p[0]===c.id?p[1]:p[1]===c.id?p[0]:null;if(otherId===null)return false;const other=S.staff.find(x=>x.id===otherId&&!x.quit);return other&&(d===S.turn?other.shift:(S.shiftPlan[d]?.[otherId]===true||S.nextShifts.includes(other.name)));})){showModal('🚫 シフト分離中',`<p>${clean(c.name)}はシフトを分ける設定があるため、この日は追加出勤できません。</p>${btn('確認','closeModal','primary block')}`);return;}if(delta==='ask'){if(c.absence>0){toast('しばらく出勤できないようです');return;}let chance=clamp(25+c.trust*.48+c.motivation*.16-c.stress*.48,5,94);if(Math.random()*100>chance){showModal('📱 出勤のお願い',`<p>${clean(c.name)}「ごめんなさい、その日は難しいです……」</p>${btn('OK','closeModal','primary block')}`);return;}}if(!S.shiftPlan[d])S.shiftPlan[d]={};S.shiftPlan[d][c.id]=delta==='ask';if(delta==='ask'){c.ownerExcludedDays=(c.ownerExcludedDays||[]).filter(x=>x!==d);}if(d===S.turn)c.shift=delta==='ask';if(d===S.turn+1)S.nextShifts=S.staff.filter(x=>!x.quit&&(Object.hasOwn(S.shiftPlan[d],x.id)?S.shiftPlan[d][x.id]:S.nextShifts.includes(x.name))).map(x=>x.name);if(d===S.turn)enforceShiftExclusions(d);log(`📅 ${c.name}の${d===S.turn?'本日':'翌日'}シフトを変更しました。`,true);displayPanel('shift');save();}
function birthdayEdit(id){const c=S.staff.find(x=>x.id===Number(id)&&!x.quit);if(!c)return;const max=S.maxTurns;showModal('🎂 '+clean(c.name)+'の誕生日を設定',`<p class="small">🎀 誕生日はオーナーが自由に決められます。今の経営期間（${max}日間）から日付を選んでね。生誕祭は誕生日の前後3日以内に開催できます。</p><label class="field">誕生日<select id="birthday-day">${Array.from({length:max},(_,i)=>`<option value="${i+1}" ${c.birthdayDay===i+1?'selected':''}>${dateLabel(i)}（${i+1}日目）</option>`).join('')}</select></label>${btn('この日に決定する','birthdaySave:'+c.id,'primary block')}${btn('やめる','closeModal','line block')}`);}
function birthdaySave(id){const c=S.staff.find(x=>x.id===Number(id)&&!x.quit),day=Number($('#birthday-day')?.value);if(!c||!Number.isInteger(day)||day<1||day>S.maxTurns)return;c.birthdayDay=day;S.story.push(`${S.turn+1}日目：${c.name}の誕生日を${dateLabel(day-1)}に設定`);closeModal();displayPanel('girls');save();toast(`🎂 ${c.name}の誕生日を${dateLabel(day-1)}に設定したよ！`);}

function planOpen(index){const opts=[['コスプレDAY',12000],['新人イベント',16000],['生誕祭',30000],['周年祭',38000],['売上達成記念',20000],['卒業イベント',18000]];const o=opts[index];if(!o||S.turn<10)return;const candidates=S.staff.filter(c=>!c.quit);const days=Array.from({length:Math.min(7,S.maxTurns-S.turn-1)},(_,i)=>S.turn+i+2);if(!days.length){toast('最終日なので新しいイベントは予約できません');return;}const isBirthday=o[0]==='生誕祭';const bdayHelp=isBirthday?`<p class="small">🎂 主役の誕生日はこの画面でオーナーが設定できます。誕生日の前後3日以内に開催してね。誕生日はキャスト管理からも変更可能です。</p><label class="field">🎂 主役の誕生日（登録）<select id="plan-birthday">${Array.from({length:S.maxTurns},(_,i)=>`<option value="${i+1}">${dateLabel(i)}（${i+1}日目）</option>`).join('')}</select></label>`:'';showModal('🎉 '+o[0]+'を企画',`<p class="small">費用 ${money(o[1])}。${isBirthday?'主役の推し客が集まり、シャンパンやチェキで盛り上がる特別な日！':'イベント当日は大きな売上チャンス！'} 連続開催するとお客さんのお財布が厳しくなります。</p><label class="field">開催日<select id="plan-day">${days.map(d=>`<option value="${d}">${dateLabel(d-1)}（${d}日目）</option>`).join('')}</select></label><label class="field">主役<select id="plan-cast"><option value="">お店全体</option>${candidates.map(c=>`<option value="${c.id}" ${isBirthday&&c.birthdayDay?'data-birthday="'+c.birthdayDay+'"':''}>${clean(c.name)}${c.birthdayDay?' 🎂'+dateLabel(c.birthdayDay-1):''}</option>`).join('')}</select></label>${bdayHelp}<p class="small">🌷 企画確定時、主役のシフトも確保します。体調不良や退職などで当日出勤できなくなる場合はあります。</p>${btn('この内容で予約する','planBook:'+index,'primary block')}${btn('やめる','closeModal','line block')}`);if(isBirthday){const castSelect=$('#plan-cast'),birthdaySelect=$('#plan-birthday'),daySelect=$('#plan-day');if(candidates.length){castSelect.value=String(candidates[0].id);birthdaySelect.value=String(candidates[0].birthdayDay||Number(daySelect.value));}castSelect.addEventListener('change',()=>{const c=candidates.find(x=>String(x.id)===castSelect.value);birthdaySelect.value=String(c?.birthdayDay||Number(daySelect.value));});}}

function planBook(index){const opts=[['コスプレDAY',12000],['新人イベント',16000],['生誕祭',30000],['周年祭',38000],['売上達成記念',20000],['卒業イベント',18000]];const o=opts[index],day=Number($('#plan-day')?.value),cid=Number($('#plan-cast')?.value||0),c=S.staff.find(x=>x.id===cid&&!x.quit);if(!o||S.turn<10||!Number.isInteger(day)||day<S.turn+2||day>S.turn+8||day>S.maxTurns)return;if((S.plannedEvents||[]).filter(x=>!x.done).length>=2){toast('予約は最大2件までです');return;}if(S.plannedEvents.some(x=>x.day===day)){toast('同じ日に複数の企画は開催できません');return;}if(S.cash<o[1]){toast('企画費用が足りません');return;}if(['生誕祭','新人イベント','卒業イベント'].includes(o[0])&&!c){toast('この企画には主役のキャストを選んでね');return;}if(o[0]==='生誕祭'){const bday=Number($('#plan-birthday')?.value);if(!c||!Number.isInteger(bday)||bday<1||bday>S.maxTurns){toast('主役の誕生日を設定してね');return;}if(Math.abs(day-bday)>3){toast('🎂 生誕祭は誕生日の前後3日以内に開催してね');return;}c.birthdayDay=bday;}S.cash-=o[1];S.profitTotal-=o[1];S.plannedEvents.push({day,kind:o[0],cast:c?.name||'',cid:c?.id||null,cost:o[1],done:false});if(c){S.shiftPlan[day]=S.shiftPlan[day]||{};S.shiftPlan[day][c.id]=true;for(const pair of S.shiftExclusions||[]){const other=pair[0]===c.id?pair[1]:pair[1]===c.id?pair[0]:null;if(other!==null)S.shiftPlan[day][other]=false;}}S.story.push(`${S.turn+1}日目：${o[0]}を${day}日目に予約`);closeModal();toast(`${dateLabel(day-1)}に${o[0]}を予約しました！`);render();}

function executePlannedEvent(){const list=(S.plannedEvents||[]).filter(e=>!e.done&&e.day===S.turn+1);for(const ev of list){ev.done=true;const c=S.staff.find(x=>x.id===ev.cid&&!x.quit);const fatigue=clamp(S.eventFatigue||0);const birthday=ev.kind==='生誕祭';let boost=Math.round((ev.cost*1.4+rand(6000,26000))*(1-fatigue/145));if(birthday&&c){const fanPower=Math.min(42000,Math.round((c.fans||0)*1200));const starPower=Math.round(Math.max(1,c.sales/25000)*1800);const guestBoost=Math.round((12000+fanPower+Math.min(20000,starPower)+rand(4000,17000))*(1-fatigue/165));const champagne=Math.max(1,Math.round((2+Math.min(5,c.fans/6)+Math.random()*3)*(1-fatigue/155)));const champagneSales=champagne*rand(8000,13500);boost+=guestBoost+champagneSales;c.sales+=Math.round(boost*.78);c.fans+=rand(1,4);modify(c,{trust:5,motivation:8,stress:4});S.visitors+=Math.max(3,Math.round(guestBoost/3800));log(`🎂✨ ${c.face} ${c.name}生誕祭！ 店内はお祝いのお客さんでいっぱい♡`,true);log(`🎊 『${c.name}ちゃん、お誕生日おめでとう〜！』 シャンパンコール！ 🍾×${champagne}`,true);log(`💗 ${c.name}の推し客が集まり、チェキやお祝いの注文が続いています！`,true);S.story.push(`${S.turn+1}日目：${c.name}の生誕祭でシャンパン${champagne}本！`);}else if(ev.cid&&!c){boost=Math.round(boost*.4);log('💔 主役が不在でイベント規模を縮小しました。',true);}S.dayRevenue+=boost;S.visitors+=Math.max(1,Math.round(boost/4000));S.popularity=clamp(S.popularity+(birthday?(fatigue>45?2:6):(fatigue>45?1:4)));S.eventFatigue=clamp(fatigue+(ev.cost>=30000?35:20));log(`🎉 ${ev.kind}${ev.cast?'（'+ev.cast+'）':''}開催！ 特別売上＋${money(boost)}♡`,true);S.story.push(`${S.turn+1}日目：${ev.kind}を開催`);}}

function maybeOwnerComplaint(){
 if(!S.autoSession)return false;
 S.autoStreak=(S.autoStreak||0)+1;
 S.autoComplaintCooldown=Math.max(0,(S.autoComplaintCooldown||0)-1);
 const n=S.autoStreak;
 if(n<=3||S.autoComplaintCooldown>0)return false;
 let chance=n<=6?.045:n<=10?.11:.20;
 const badStock=S.stock<=8, badClean=S.cleanliness<=50;
 const understaffed=activeGirls().length<=1;
 const strained=activeGirls().some(c=>c.stress>=70);
 if(badStock)chance+=.06;
 if(badClean)chance+=.08;
 if(understaffed)chance+=.05;
 if(strained)chance+=.04;
 const lead=S.staff.find(c=>c.id===S.autoSession.leader);
 if(lead&&(lead.trait==='敏腕'||lead.personality==='まじめ')&&!badClean&&!badStock)chance*=.65;
 // 店長自身が店を管理していれば不満は起こりにくい。
 if(S.lastOwnerCareTurn!==undefined&&S.turn-S.lastOwnerCareTurn<=2)chance*=.55;
 if(Math.random()>=Math.min(.55,chance))return false;
 S.autoComplaintCooldown=4;
 S.autoComplaintCount=(S.autoComplaintCount||0)+1;
 S.eventPending={type:'ownerAbsenceComplaint'};
 stopAutoTimer();
 log('😡 常連客から「最近、店長がいない」とクレームが入りました！',true);
 showModal('😡 お客様から店長へのクレーム！',`<p>👤 常連客「最近、店長を全然見かけないんだけど？」</p><div class="message">「女の子にばっかり仕事させて、何してるの？ ちゃんと仕事しろよ！😡」</div><p class="small">おまかせ営業 ${n}日連続。どう対応しますか？</p>${btn('🙇 謝罪して改善を約束','ownerComplaint:apologize','primary block')}${btn('🧹 自分も仕事をすると伝える','ownerComplaint:work','alt block')}${btn('💬 任せている理由を説明','ownerComplaint:explain','line block')}${btn('😠 言い返す','ownerComplaint:argue','line block')}`);
 return true;
}
function autoUpdateScreen(){if(!S.autoSession)return;const a=S.autoSession;const label=$('#autoLabel'),progress=$('#autoProgress'),clock=$('#clock');if(label)label.textContent=`🎀 おまかせ営業 ${Math.min(a.days+1,a.target)} / ${a.target}日目`;if(progress)progress.style.width=`${Math.round((S.clock||0)/25*100)}%`;if(clock){const h=18+Math.floor(S.clock/5),m=(S.clock%5)*12;clock.textContent=`${String(Math.min(h,23)).padStart(2,'0')}:${String(m).padStart(2,'0')}`;}}
function autoRecordDay(a){if(!S.lastEnd||a.recordedTurn===S.turn)return;const today=S.logs.slice(a.dayLogStart).filter(x=>x.special||/ライブ|シャンパン|常連|指導|ランク|推し|接客|遅刻|欠勤/.test(x.text)).slice(-4).map(x=>x.text);a.logs.push({day:S.turn+1,income:S.lastEnd.income,expense:S.lastEnd.expense,lines:today});a.income+=S.lastEnd.income;a.expense+=S.lastEnd.expense;a.days++;a.remaining--;a.recordedTurn=S.turn;}
function autoResults(){const a=S.autoSession;if(!a)return;stopAutoTimer();const leader=S.staff.find(c=>c.id===a.leader);if(leader){modify(leader,{trust:2,stress:Math.min(9,a.days)});leader.xp[0]+=a.days*3;}const diff=(n)=>`${n>=0?'+':''}${n}`;const rows=a.logs.map(r=>`<div class="card" style="margin:8px 0"><b>🌸 ${r.day}日目</b><span style="float:right" class="small">売上 ${money(r.income)} ／ 経費 ${money(r.expense)}</span>${r.lines.length?r.lines.map(t=>`<div class="small" style="margin-top:5px">${clean(t)}</div>`).join(''):'<div class="small">いつもどおり営業しました♡</div>'}</div>`).join('');S.autoSession=null;save();showModal('🎀 おまかせ営業・結果発表！',`<p>👑 リーダー：${clean(leader?.name||'キャスト')} ／ ${a.days}日間</p><div class="grid"><div class="card">💰 総売上<h3>${money(a.income)}</h3></div><div class="card">💸 経費<h3>${money(a.expense)}</h3></div></div><div class="message">💗 お客様満足度 ${diff(customerSatisfaction()-a.customerStart)}点 ／ 👧 キャスト満足度 ${diff(castSatisfaction()-a.staffStart)}点<br>🌷 店舗人気 ${diff(Math.round(S.popularity-a.popStart))} ／ 🏆 ランキング ${a.rankStart}位 → ${rankings().findIndex(x=>x.player)+1}位</div><h3>📜 日ごとの営業ログ</h3>${rows}${btn('結果を確認した ♡','autoDone','primary block')}`);}
function autoResume(){const a=S.autoSession;if(!a||S.eventPending)return;stopAutoTimer();closeModal();S.playSpeed=0;autoBusy=true;
 const step=()=>{autoTimer=null;if(!S.autoSession||S.eventPending){stopAutoTimer();return;}if(S.phase==='report'){autoRecordDay(a);if(a.remaining<=0||S.turn>=S.maxTurns-1){autoResults();return;}advance();if(S.mode==='end'){autoResults();return;}}

function handleAction(act){if(act.startsWith('ownerComplaint:')){

 if(type==='apologize'){S.review=clamp(S.review-1);S.autoComplaintCooldown=5;log('🙇 店長が謝罪し、改善を約束しました。',true);}

 }if(act==='ownerClean'){if(S.ownerCleanTurn===S.turn){toast('今日はもう清掃済みです');return;}if(S.phase==='report'){toast('閉店後には清掃できません');return;}S.ownerCleanTurn=S.turn;S.lastOwnerCareTurn=S.turn;S.cleanedTurn=S.turn;S.uncleanDays=0;S.cleanliness=clamp(S.cleanliness+20);log(`🧹 店長が清掃をしました！清潔度＋20`,true);closeModal();render();return;}if(act.startsWith('badCustomer:')){resolveBadCustomer(act.split(':')[1]);return;}if(act.startsWith('drunk:')){const c=S.staff.find(x=>x.id===S.eventPending?.id);if(c){c.shift=false;c.absence=rand(1,3);log(`🍹 ${c.name}が体調を崩して帰宅。${c.absence}日間お休みします。`,true);modify(c,{stress:6,trust:act.endsWith('medical')?6:3});}S.eventPending=null;closeModal();if(S.autoSession)autoResume();else if(S.phase==='during')startTick();return;}if(act==='autoSkip'){if(S.autoSession){S.autoSession.fast=true;toast('⏩ 残りの営業を高速で進めます');}return;}if(act.startsWith('autoStart:')){autoStart(Number(act.split(':')[1]));return;}if(act==='autoResume'||act==='autoEventOk'){if(act==='autoEventOk'&&S.autoSession)S.autoSession.approvedEventDay=S.turn+1;autoResume();return;}if(act==='autoCancel'){stopAutoTimer();S.autoSession=null;closeModal();playView();return;}if(act==='autoDone'){closeModal();if(S.phase==='report')reportView();else render();return;}if(act.startsWith('absence:')){const ev=S.eventPending,c=S.staff.find(x=>x.id===ev?.id);if(c){modify(c,{trust:act.endsWith('call')?2:0,stress:2});log(`📵 ${c.name}は本日欠勤。給与は発生しません。`,true);}S.eventPending=null;closeModal();if(S.autoSession)autoResume();else if(S.phase==='during')startTick();return;}if(act.startsWith('attendance:')){const choice=act.split(':')[1],ev=S.eventPending,c=S.staff.find(x=>x.id===ev?.id);if(c){modify(c,choice==='strict'?{trust:-7,stress:8}:choice==='kind'?{trust:1,stress:1}:{trust:2});log(`⏰ ${c.name}の遅刻に対応しました。`,true);}S.eventPending=null;closeModal();if(S.phase==='during')startTick();if(S.autoSession)autoResume();return;}if(act==='harassInvestigate'){resolveHarassment('investigate');return;}if(act==='harassSeparateEarly'){resolveHarassment('separateEarly');return;}if(act==='harassWatch'){resolveHarassment('watch');return;}if(act.startsWith('harassResolve:')){resolveHarassment(act.split(':')[1]);return;}if(act.startsWith('separateOff:')){const ix=Number(act.split(':')[1]);if(Number.isInteger(ix)&&ix>=0&&ix<(S.shiftExclusions||[]).length){S.shiftExclusions.splice(ix,1);save();displayPanel('shift');}return;}if(act.startsWith('birthday:')){birthdayEdit(act.split(':')[1]);return;}if(act.startsWith('birthdaySave:')){birthdaySave(act.split(':')[1]);return;}if(act.startsWith('planOpen:')){planOpen(Number(act.split(':')[1]));return;}if(act.startsWith('planBook:')){planBook(Number(act.split(':')[1]));return;}if(act==='noticeOk'){closeModal();if(S.phase==='report')reportView();else playView();return;}if(act==='incidentOk'){S.cash-=800;S.profitTotal-=800;S.eventPending=null;closeModal();log('🍾 お酒が割れ、800円の損失が発生しました。',true);if(S.autoSession)autoResume();else if(S.phase==='during')startTick();return;}if(act.startsWith('shiftAsk:')||act.startsWith('shiftOff:')){let [k,id]=act.split(':');setShift(id,k==='shiftAsk'?'ask':'off');return;}if(act==='restart'){if(!confirm('最初からやり直しますか？\n現在のセーブデータ（名前・採用・経営状況）は消去されます。'))return;stopAutoTimer();clearTimers();closeModal();try{localStorage.removeItem('boku-cafe-v2');}catch(e){}startNew();return;}if(act==='new'){if(S&&!S.finished&&!confirm('現在の進行を消して、はじめから遊びますか？'))return;startNew();return;}if(act==='continue'){if(load())render();else home();return;}if(!S)return;if(act==='setupBack'){S.step=Math.max(0,S.step-1);render();return;}if(act==='setupNext'){if(S.step===0){let a=$('#owner')?.value.trim();if(!a){toast('オーナー名を入力してね');return;}S.owner=a;}if(S.step===1){let a=$('#store')?.value.trim();if(!a){toast('店名を入力してね');return;}S.store=a;S.concept=$('#concept')?.value||S.concept;if(S.concept==='オリジナル')S.concept=$('#customconcept')?.value.trim()||'オリジナル';}if(S.step===3){let a=$('#opendate')?.value;if(!a){toast('開店日を選んでね');return;}S.openDate=a;}if(S.step===4){S.rivals=createRivals(S.place);S.mode='tutorial';render();return;}S.step++;render();return;}if(act==='tutorialBack'){S.mode='setup';S.step=4;render();return;}if(act==='tutorialDone'){S.mode='hire';createApplications(true);render();return;}if(act==='open'){if(!S.staff.length){toast('開店には1人以上の採用が必要です');return;}openGame();return;}if(act.startsWith('accept:')||act.startsWith('reject:')){let [a,id]=act.split(':'),c=S.applications.find(x=>x.id===+id);if(c&&!c.decided){c.decided=a==='accept'?'yes':'no';if(a==='accept'){c.salary=S.wage;S.staff.push(c);}}render();return;}if(act==='begin'){beginDay();return;}if(act==='pause'){S.playSpeed=S.playSpeed===0?1:0;playView();return;}if(act==='speed'){S.playSpeed=S.playSpeed===3?1:3;playView();return;}if(act==='close'){closeDay();return;}if(act==='report'){if(!showNotice())reportView();return;}if(act==='next'){if(!showNotice())advance();return;}if(act.startsWith('panel:')){displayPanel(act.slice(6));return;}if(act.startsWith('task:')){chooseTask(act.slice(5));return;}if(act.startsWith('hireLater:')||act.startsWith('skipLater:')){let [a,id]=act.split(':'),c=S.applications.find(x=>x.id===+id);if(c&&!c.decided){c.decided=a==='hireLater'?'yes':'no';if(a==='hireLater'){c.salary=S.wage;S.staff.push(c);S.logs.push({text:`🎀 ${c.name}を新たに採用しました！`,special:true});}save();displayPanel('jobs');}return;}if(act.startsWith('event:')){resolveEvent(act.split(':')[1]);return;}if(act.startsWith('talk:')){talk(act.slice(5));return;}if(act==='closeModal'){closeModal();return;}}
document.addEventListener('click',e=>{let t=e.target.closest('[data-act]');if(t){handleAction(t.dataset.act);return;}let p=e.target.closest('[data-place]');if(p){S.place=p.dataset.place;render();return;}let w=e.target.closest('[data-wage]');if(w){S.wage=+w.dataset.wage;render();return;}let b=e.target.closest('[data-back]');if(b){S.back=b.dataset.back;render();return;}let task=e.target.closest('[data-modal-task]');if(task){let [id,i]=task.dataset.modalTask.split(':');taskDo(id,i);return;}let ord=e.target.closest('[data-order]');if(ord){let [n,m]=ord.dataset.order.split(':').map(Number);if(S.cash<m){toast('資金が足りません');return;}S.cash-=m;S.profitTotal-=m;S.stock+=n;S.lastOwnerCareTurn=S.turn;save();displayPanel('order');toast(`${n}個発注しました！`);return;}});
document.addEventListener('change',e=>{if(e.target.id==='concept'){S.concept=e.target.value;let el=$('#customwrap');if(el)el.style.display=S.concept==='オリジナル'?'':'none';}if(e.target.matches('[data-rule]')){let key=e.target.dataset.rule,val=e.target.value;S.rules[key]=val;for(let c of S.staff.filter(x=>!x.quit)){if(key==='safety')modify(c,{trust:val==='厳しく対応'?5:-9,stress:val==='厳しく対応'?-3:5});if(key==='quota')modify(c,{motivation:val==='あり'?(c.personality==='負けず嫌い'?6:-3):3,stress:val==='あり'?5:-3});if(key==='sns')modify(c,{trust:val==='投稿前に確認'?-2:2});if(key==='shift')modify(c,{trust:val==='お店を優先'?-6:3});}save();toast('ルールを変更しました。キャストにも影響します。');}});
if(load()){if(S.phase==='during')S.playSpeed=0;render();}else home();})();</script></body></html>
